<meta charset="utf-8">
<title>コインクエスト</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COINQUEST">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Fredoka:wght@500;700&family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
  :root {
    --sky: #8fd3f4;
    --sky-deep: #5db4e6;
    --grass: #63c74d;
    --grass-dark: #3e8e41;
    --dirt: #8b5a2b;
    --dirt-dark: #5c3a1b;
    --stone: #9aa0a6;
    --stone-dark: #5f6368;
    --gold: #f6c343;
    --gold-dark: #c98a12;
    --paper: #fffaf0;
    --ink: #2b2118;
    --ink-soft: #6b5b4e;
    --ok: #4cbb3a;
    --ok-dark: #2f8a25;
    --oops: #f28b3b;
    --oops-dark: #c25f12;
    --blue: #3f8fe0;
    --blue-dark: #235e9c;
    --font-ja: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    --font-en: "Fredoka", "M PLUS Rounded 1c", "Arial Rounded MT Bold", sans-serif;
    --font-pixel: "DotGothic16", "M PLUS Rounded 1c", monospace;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--sky);
    background-image: linear-gradient(180deg, var(--sky) 0%, #bfe9fb 100%);
    color: var(--ink);
    font-family: var(--font-ja);
    font-weight: 500;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    touch-action: manipulation;
  }
  #app {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column;
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
    max-width: 760px;
    margin: 0 auto;
  }
  /* ground strip */
  .ground {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
    background:
      linear-gradient(180deg, var(--grass) 0 14px, var(--grass-dark) 14px 18px, var(--dirt) 18px 100%);
    background-size: 100% 100%;
    z-index: 0;
    pointer-events: none;
  }
  .ground::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 28px, rgba(0,0,0,.08) 28px 32px);
    opacity: .6;
  }
  .cloud {
    position: fixed; top: 6%; width: 120px; height: 36px; background: #fff; opacity: .85;
    border-radius: 0; z-index: 0; pointer-events: none;
    box-shadow: 24px -18px 0 0 #fff, 56px -12px 0 0 #fff, 76px 6px 0 0 #fff;
    animation: drift 60s linear infinite;
  }
  .cloud.c2 { top: 16%; left: 70%; animation-duration: 85s; animation-delay: -30s; transform: scale(.7); }
  @keyframes drift { from { left: -160px; } to { left: 110%; } }
  .cloud.c2 { animation-name: drift2; }
  @keyframes drift2 { from { left: -160px; } to { left: 110%; } }
  @media (prefers-reduced-motion: reduce) { .cloud { animation: none; left: 10%; } .cloud.c2 { left: 70%; } }

  .screen {
    position: relative; z-index: 1;
    flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto;
  }

  /* --- top bar --- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 44px;
  }
  .wallet {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--paper); border: 3px solid var(--dirt-dark);
    padding: 4px 12px 4px 6px; font-family: var(--font-en); font-weight: 700; font-size: 22px;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 0 var(--dirt-dark);
  }
  .coin {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3b0, var(--gold) 55%, var(--gold-dark));
    border: 2px solid var(--gold-dark); color: #7a4c00;
    font-family: var(--font-en); font-weight: 700; font-size: 15px; line-height: 1;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
  }
  .coin.sm { width: 24px; height: 24px; font-size: 12px; }

  /* --- blocks (buttons) --- */
  .btn {
    appearance: none; border: 0; cursor: pointer; font-family: var(--font-ja); font-weight: 800;
    color: #fff; background: var(--blue); border: 3px solid var(--blue-dark);
    box-shadow: 0 6px 0 var(--blue-dark);
    padding: 14px 24px; font-size: 22px; line-height: 1.2;
    transition: transform .05s ease, box-shadow .05s ease;
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--blue-dark); }
  .btn:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }
  .btn.big { font-size: 30px; padding: 20px 40px; }
  .btn.green { background: var(--grass); border-color: var(--grass-dark); box-shadow: 0 6px 0 var(--grass-dark); }
  .btn.green:active { box-shadow: 0 1px 0 var(--grass-dark); }
  .btn.gold { background: var(--gold); border-color: var(--gold-dark); box-shadow: 0 6px 0 var(--gold-dark); color: #5a3a00; text-shadow: none; }
  .btn.gold:active { box-shadow: 0 1px 0 var(--gold-dark); }
  .btn.ghost { background: var(--paper); border-color: var(--stone-dark); box-shadow: 0 6px 0 var(--stone-dark); color: var(--ink); text-shadow: none; }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--stone-dark); }
  .btn.small { font-size: 16px; padding: 8px 14px; box-shadow: 0 4px 0 var(--stone-dark); }
  .btn.small:active { box-shadow: 0 1px 0 var(--stone-dark); }
  /* the "next" block: pressed after a miss, so make it the easiest thing to hit */
  .btn.next {
    background: var(--grass); border-color: var(--grass-dark); color: #fff;
    box-shadow: 0 7px 0 var(--grass-dark); text-shadow: 0 2px 0 rgba(0,0,0,.25);
    font-size: clamp(24px, 5vw, 32px); padding: 18px 36px;
    min-height: 68px; min-width: 220px;
  }
  .btn.next:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--grass-dark); }
  .btn[disabled] { opacity: .55; cursor: default; }

  /* --- home --- */
  .home-center {
    margin-block: auto; display: flex; flex-direction: column; align-items: center; gap: 22px;
    text-align: center; padding-block: 8px;
  }
  /* --- Minecraft-style logo --- */
  .logo-wrap { position: relative; display: inline-block; padding-bottom: 30px; }
  .logo {
    position: relative; display: inline-block; margin: 0;
    font-family: "Press Start 2P", var(--font-pixel);
    font-weight: 400; font-size: clamp(28px, 8.7vw, 68px); line-height: 1;
    white-space: nowrap; letter-spacing: 0;
    color: #b9b9b9;                       /* face colour, covered by the gradient layer */
    padding: 0.10em 0.26em 0.30em 0.06em; /* room for the extrusion */
    text-shadow:
      /* black outline hugging the face */
      0 -0.055em 0 #0d0d0d, 0 0.055em 0 #0d0d0d, -0.055em 0 0 #0d0d0d, 0.055em 0 0 #0d0d0d,
      -0.055em -0.055em 0 #0d0d0d, 0.055em -0.055em 0 #0d0d0d,
      -0.055em 0.055em 0 #0d0d0d, 0.055em 0.055em 0 #0d0d0d,
      /* extruded side, stepping back and darkening */
      0.075em 0.075em 0 #9a9a9a, 0.095em 0.095em 0 #8d8d8d, 0.115em 0.115em 0 #808080,
      0.135em 0.135em 0 #737373, 0.155em 0.155em 0 #666666, 0.175em 0.175em 0 #595959,
      /* outline of the extrusion, then the shadow it casts */
      0.215em 0.215em 0 #0d0d0d, 0.275em 0.275em 0 rgba(13, 13, 13, .32);
  }
  .logo::after {          /* the two-tone stone face, sitting exactly on the letters */
    content: attr(data-text);
    position: absolute; left: 0; top: 0; padding: inherit;
    background: linear-gradient(180deg, #ececec 0%, #dcdcdc 47%, #a2a2a2 47%, #8e8e8e 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; text-shadow: none; pointer-events: none;
  }
  .splash {
    position: absolute; right: 0.4em; bottom: 0.6em; margin: 0;
    font-family: "Press Start 2P", var(--font-pixel);
    font-size: clamp(9px, 2.3vw, 15px); line-height: 1.3;
    color: #ffef4a; text-shadow: 0.14em 0.14em 0 #3d3000;
    transform: rotate(-10deg); white-space: nowrap; pointer-events: none;
    animation: splash 1.1s ease-in-out infinite;
  }
  @keyframes splash { 50% { transform: rotate(-10deg) scale(1.09); } }
  @media (prefers-reduced-motion: reduce) { .splash { animation: none; } }
  .purse {
    background: var(--paper); border: 3px solid var(--dirt-dark); box-shadow: 0 6px 0 var(--dirt-dark);
    padding: 12px 16px; width: min(100%, 520px); box-sizing: border-box;
  }
  .purse-head { display: flex; align-items: baseline; justify-content: center; gap: 10px; font-family: var(--font-en); font-weight: 700; }
  .purse-head .num { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
  .purse-head .unit { font-family: var(--font-ja); font-weight: 800; font-size: 18px; color: var(--ink-soft); }
  .yen-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; min-height: 30px; }
  .yen {
    display: inline-flex; align-items: center; justify-content: center; position: relative;
    width: 34px; height: 34px; border-radius: 50%; font-family: var(--font-en); font-weight: 700; font-size: 12px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), 0 1px 0 rgba(0,0,0,.2);
  }
  .yen.y500 { background: radial-gradient(circle at 35% 30%, #fff1b8, #e0b84a 60%, #a97c12); color: #5a3a00; border: 2px solid #a97c12; }
  .yen.y100 { background: radial-gradient(circle at 35% 30%, #ffffff, #d9dde2 60%, #8f969e); color: #3a3f45; border: 2px solid #8f969e; }
  .yen.y50  { background: radial-gradient(circle at 35% 30%, #ffffff, #d9dde2 60%, #8f969e); color: #3a3f45; border: 2px solid #8f969e; }
  .yen.y10  { background: radial-gradient(circle at 35% 30%, #f6c9a0, #c47a3a 60%, #7a4416); color: #fff; border: 2px solid #7a4416; }
  .yen.y5   { background: radial-gradient(circle at 35% 30%, #fff5c4, #dcbb4c 60%, #9e7d14); color: #5a3a00; border: 2px solid #9e7d14; }
  .yen.y1   { background: radial-gradient(circle at 35% 30%, #ffffff, #eef0f2 60%, #b9bec4); color: #555; border: 2px solid #b9bec4; }
  .yen.y50::after, .yen.y5::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,.3); top: 4px; right: 4px; }
  .yen .x { position: absolute; bottom: -8px; right: -8px; background: var(--ink); color: #fff; font-size: 11px; padding: 1px 4px; border-radius: 3px; font-family: var(--font-en); }
  .purse-note { margin: 8px 0 0; font-size: 13px; color: var(--ink-soft); }

  /* up to BANK_MAX slots can pile up, so this row has to wrap */
  .day-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; justify-content: center; max-width: min(100%, 520px); }
  .day-row .lbl { width: 100%; text-align: center; }
  .day-row .lbl { font-weight: 800; color: var(--dirt-dark); font-size: 16px; }
  .slot {
    width: 30px; height: 30px; border: 3px solid var(--dirt-dark); background: var(--paper);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.08);
  }
  .slot.on { background: linear-gradient(180deg, var(--grass) 0 40%, var(--dirt) 40% 100%); }

  .purse { -webkit-touch-callout: none; }
  .pin-box input { font-family: var(--font-en); font-size: 28px; letter-spacing: .3em; width: 8ch; text-align: center; padding: 6px; border: 3px solid var(--dirt-dark); }

  /* --- play --- */
  /* a row of stone blocks: every answer mines one away */
  .progress {
    --blk: clamp(34px, 6vw, 48px);
    display: grid; grid-template-columns: repeat(10, var(--blk));
    gap: 6px; justify-content: center; margin-top: 12px;
  }
  @media (max-width: 560px) { .progress { grid-template-columns: repeat(5, var(--blk)); } }
  .pblock {
    position: relative;
    width: var(--blk); height: var(--blk);
    border: 2px solid #56565a; image-rendering: pixelated;
    background-color: #9d9d9d; background-size: 100% 100%;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3e%3crect width='16' height='16' fill='%239d9d9d'/%3e%3cg fill='%23888888'%3e%3crect x='2' y='1' width='3' height='2'/%3e%3crect x='9' y='2' width='4' height='2'/%3e%3crect x='1' y='6' width='2' height='3'/%3e%3crect x='6' y='5' width='3' height='2'/%3e%3crect x='11' y='7' width='3' height='2'/%3e%3crect x='4' y='10' width='4' height='2'/%3e%3crect x='10' y='12' width='3' height='2'/%3e%3crect x='1' y='13' width='2' height='2'/%3e%3c/g%3e%3cg fill='%23b4b4b4'%3e%3crect x='6' y='1' width='2' height='1'/%3e%3crect x='13' y='5' width='2' height='1'/%3e%3crect x='3' y='8' width='2' height='1'/%3e%3crect x='8' y='9' width='2' height='1'/%3e%3crect x='5' y='13' width='3' height='1'/%3e%3c/g%3e%3c/svg%3e");
    box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.25);
  }
  .pblock.now { border-color: var(--gold-dark); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.25), 0 0 0 2px var(--gold); }
  .pblock.now::after {            /* the block you are digging right now */
    content: ""; position: absolute; inset: 0; background-size: 100% 100%;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3e%3cg fill='%23000000'%3e%3crect x='7' y='1' width='1' height='4'/%3e%3crect x='8' y='5' width='1' height='2'/%3e%3crect x='4' y='7' width='4' height='1'/%3e%3crect x='9' y='7' width='4' height='1'/%3e%3crect x='3' y='4' width='1' height='3'/%3e%3crect x='8' y='8' width='1' height='4'/%3e%3crect x='11' y='9' width='1' height='4'/%3e%3crect x='5' y='9' width='1' height='4'/%3e%3crect x='2' y='11' width='3' height='1'/%3e%3crect x='12' y='3' width='1' height='3'/%3e%3c/g%3e%3c/svg%3e");
    animation: mine 1.1s steps(1) infinite;
  }
  @keyframes mine { 0%, 49% { opacity: .3; } 50%, 100% { opacity: .8; } }
  .pblock.done {                  /* mined out: an empty slot */
    background-image: none; background-color: rgba(13,13,13,.09);
    border-color: rgba(13,13,13,.13); box-shadow: none;
  }
  .pblock.breaking { animation: shatter .3s ease-out; }
  @keyframes shatter {
    0%   { transform: scale(1); background-color: rgba(255,255,255,.75); }
    45%  { transform: scale(1.3) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pblock.now::after { animation: none; opacity: .6; }
    .pblock.breaking { animation: none; }
  }

  .card {
    background: var(--paper); border: 3px solid var(--dirt-dark); box-shadow: 0 6px 0 var(--dirt-dark);
    padding: 18px 16px; margin-top: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  }
  .kind { font-size: clamp(17px, 3.2vw, 24px); font-weight: 800; color: var(--ink-soft); letter-spacing: .08em; margin: 0; }
  .prompt-en { font-family: var(--font-en); font-weight: 700; font-size: clamp(34px, 8vw, 56px); line-height: 1.15; margin: 0; color: var(--ink); text-wrap: balance; }
  .prompt-ja { font-weight: 800; font-size: clamp(30px, 7vw, 44px); line-height: 1.2; margin: 0; }
  .prompt-sent { font-family: var(--font-en); font-weight: 500; font-size: clamp(22px, 5vw, 32px); line-height: 1.4; margin: 0; text-wrap: balance; max-width: 34ch; }
  .nb { white-space: nowrap; }   /* keeps the blank and the punctuation after it together */
  .blank.tight { margin-right: 0; }   /* no gap before a full stop */
  .blank { display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--blue); margin: 0 .15em; vertical-align: baseline; color: var(--blue); font-weight: 700; }
  .blank.filled { border-bottom-color: var(--ok-dark); color: var(--ok-dark); }
  .speak {
    appearance: none; border: 3px solid var(--blue-dark); background: var(--blue); color: #fff; width: 56px; height: 56px;
    font-size: 26px; cursor: pointer; box-shadow: 0 4px 0 var(--blue-dark); line-height: 1;
  }
  .speak:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  @media (max-width: 420px) { .choices { grid-template-columns: 1fr; gap: 10px; } }
  .choice {
    appearance: none; cursor: pointer; min-height: 72px; padding: 12px 10px;
    background: var(--paper); border: 3px solid var(--stone-dark); box-shadow: 0 6px 0 var(--stone-dark);
    font-family: var(--font-ja); font-weight: 800; font-size: clamp(20px, 5vw, 28px); color: var(--ink); line-height: 1.2;
    transition: transform .05s ease, box-shadow .05s ease;
    overflow-wrap: anywhere;
  }
  .choice.en { font-family: var(--font-en); font-weight: 700; font-size: clamp(22px, 5.5vw, 30px); }
  .choice:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--stone-dark); }
  .choice:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }
  .choice.right { background: #dff5d6; border-color: var(--ok-dark); box-shadow: 0 6px 0 var(--ok-dark); }
  .choice.wrong { background: #ffe6d1; border-color: var(--oops-dark); box-shadow: 0 6px 0 var(--oops-dark); }
  .choice.dim { opacity: .45; }
  .choice[disabled] { cursor: default; }

  .after { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 18px; margin-top: 16px; min-height: 76px; padding-bottom: 64px; }
  .verdict { font-weight: 800; font-size: clamp(28px, 6vw, 44px); line-height: 1.2; margin: 0; }
  .verdict.ok { color: var(--ok-dark); }
  .verdict.oops { color: var(--oops-dark); }

  /* --- result --- */
  .result { margin-block: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding-block: 8px; }
  .big-word { font-family: var(--font-pixel); font-size: clamp(40px, 10vw, 72px); color: #fff; text-shadow: 4px 4px 0 var(--dirt-dark); margin: 0; line-height: 1; }
  .gain { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-en); font-weight: 700; font-size: 40px; background: var(--paper); border: 3px solid var(--gold-dark); box-shadow: 0 6px 0 var(--gold-dark); padding: 8px 22px; }
  .review { background: var(--paper); border: 3px solid var(--dirt-dark); box-shadow: 0 6px 0 var(--dirt-dark); padding: 10px 14px; width: min(100%, 520px); box-sizing: border-box; }
  .review h3 { margin: 0 0 6px; font-size: 15px; color: var(--ink-soft); font-weight: 800; }
  .review-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { appearance: none; cursor: pointer; border: 2px solid var(--blue-dark); background: #eaf3fd; color: var(--ink); font-family: var(--font-en); font-weight: 700; font-size: 18px; padding: 6px 12px; box-shadow: 0 3px 0 var(--blue-dark); }
  .chip small { font-family: var(--font-ja); font-weight: 800; font-size: 13px; color: var(--ink-soft); margin-left: 6px; }
  .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--blue-dark); }

  .rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .rain .coin { position: absolute; top: -40px; animation: fall 1.8s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .rain { display: none; } }

  /* --- parent panel --- */
  .panel { position: fixed; inset: 0; background: rgba(20,14,8,.55); z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .panel-box { background: var(--paper); border: 3px solid var(--dirt-dark); box-shadow: 0 6px 0 var(--dirt-dark); padding: 16px; width: min(100%, 420px); max-height: 90%; overflow: auto; box-sizing: border-box; }
  .panel-box h2 { margin: 0 0 10px; font-size: 18px; }
  .panel-box p { margin: 6px 0; font-size: 14px; color: var(--ink-soft); }
  .panel-box .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; align-items: center; }
  .panel-box label { font-size: 14px; font-weight: 800; }
  .panel-box select { font-family: var(--font-ja); font-size: 16px; padding: 6px; }
  .panel-box .amt { font-family: var(--font-en); font-size: 16px; padding: 6px; width: 6ch; text-align: right; }
  .panel-box textarea { width: 100%; box-sizing: border-box; font-family: var(--font-en); font-size: 12px; height: 62px; padding: 6px; border: 2px solid var(--stone-dark); }
  .stat { font-variant-numeric: tabular-nums; }

  /* --- quest picker & kanji mode --- */
  .pick-list { display: flex; flex-direction: column; gap: 16px; width: min(100%, 460px); }
  .pick {
    appearance: none; cursor: pointer; text-align: left;
    background: var(--paper); border: 3px solid var(--dirt-dark); box-shadow: 0 6px 0 var(--dirt-dark);
    padding: 16px 18px; font-family: var(--font-ja); color: var(--ink);
    display: flex; align-items: center; gap: 14px;
  }
  .pick:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--dirt-dark); }
  .pick .ico { font-size: 34px; line-height: 1; }
  .pick .ttl { display: block; font-weight: 800; font-size: 24px; line-height: 1.2; }
  .pick .sub { display: block; font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
  .backline { display: flex; justify-content: center; }

  .due { font-family: var(--font-ja); font-weight: 800; font-size: 18px; color: var(--dirt-dark); }
  .due.soon { color: var(--oops-dark); }
  /* the wall you build: one block per kanji learned */
  .wall {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px;
    width: min(100%, 520px); background: var(--paper);
    border: 3px solid var(--dirt-dark); box-shadow: 0 6px 0 var(--dirt-dark); padding: 8px;
    box-sizing: border-box;
  }
  @media (max-width: 480px) { .wall { grid-template-columns: repeat(8, 1fr); } }
  .wcell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: clamp(13px, 3.4vw, 22px); font-weight: 800; font-family: var(--font-ja);
    background: rgba(13,13,13,.07); border: 2px solid rgba(13,13,13,.10); color: transparent;
  }
  .wcell.on {
    background: linear-gradient(180deg, #ffe9a8 0%, var(--gold) 55%, var(--gold-dark) 100%);
    border-color: var(--gold-dark); color: #5a3a00;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.18);
  }
  .wcell.just { animation: place .45s ease-out; }
  @keyframes place { 0% { transform: translateY(-18px) scale(1.25); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .wcell.just { animation: none; } }

  .kanji-big { font-family: var(--font-ja); font-weight: 800; font-size: clamp(90px, 26vw, 170px); line-height: 1; margin: 0; }
  .yomi-big { font-family: var(--font-ja); font-weight: 800; font-size: clamp(34px, 8vw, 56px); line-height: 1.2; margin: 0; }
  .choice.kanji { font-size: clamp(38px, 10vw, 54px); font-weight: 800; min-height: 96px; }

  /* --- さんすう --- */
  .sum { font-family: var(--font-en); font-weight: 700; font-size: clamp(46px, 13vw, 84px); line-height: 1; margin: 0; letter-spacing: .04em; }
  .ansbox {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 3.2ch; min-height: 1.25em; padding: 0 .12em;
    font-family: var(--font-en); font-weight: 700; font-size: clamp(46px, 13vw, 84px); line-height: 1.25;
    border-bottom: 6px solid var(--blue); color: var(--blue);
  }
  .ansbox.ok { border-bottom-color: var(--ok-dark); color: var(--ok-dark); }
  .ansbox.ng { border-bottom-color: var(--oops-dark); color: var(--oops-dark); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; padding-bottom: 64px; width: min(100%, 420px); margin-inline: auto; }
  .key {
    appearance: none; cursor: pointer; min-height: 68px;
    background: var(--paper); border: 3px solid var(--stone-dark); box-shadow: 0 6px 0 var(--stone-dark);
    font-family: var(--font-en); font-weight: 700; font-size: 34px; color: var(--ink);
    transition: transform .05s ease, box-shadow .05s ease;
  }
  .key:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--stone-dark); }
  .key.del { font-family: var(--font-ja); font-weight: 800; font-size: 22px; background: #f1e7d8; }
  .ev-time { font-family: var(--font-en); font-weight: 700; }
  .bigtime { font-family: var(--font-en); font-weight: 700; font-size: clamp(52px, 14vw, 88px); line-height: 1; margin: 0; color: #fff; text-shadow: 3px 3px 0 var(--dirt-dark); }
  /* single characters do not need a full-width row, so keep 2x2 even on a phone */
  @media (max-width: 420px) { #kChoices { grid-template-columns: 1fr 1fr; } .choice.kanji { min-height: 84px; } }
  .hint { font-size: 12px; color: var(--ink-soft); }

  /* =============================================================
     WORLD: the blocky scenery behind every screen, and its three moods.
     Colours live in variables so text sitting directly on the sky can
     stay readable at dusk and at night.
     ============================================================= */
  body {
    --gb: 24px; --nb: 18px; --fb: 11px;              /* ground / near / far block size */
    --sky-top: #5fb8ef; --sky-mid: #8fd3f4; --sky-bot: #d4f1ff;
    --sun: #ffe66b; --sun-core: #fff8c4; --sun-halo: rgba(255,240,150,.35); --sun-glow: rgba(255,240,170,.45);
    --cloud: #ffffff; --cloud-op: .9; --stars-op: 0; --ground-dim: transparent;
    --on-sky: #5c3a1b; --on-sky-sh: none; --ok-text: #2f8a25; --oops-text: #c25f12;
    background: var(--sky-bot);
    background-image: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bot) 100%);
  }
  body[data-theme="dusk"] {
    --sky-top: #2a1f5c; --sky-mid: #b8557a; --sky-bot: #ffb45e;
    --sun: #ff8a3c; --sun-core: #ffc56e; --sun-halo: rgba(255,140,60,.35); --sun-glow: rgba(255,120,60,.55);
    --cloud: #ffc9cf; --cloud-op: .75; --stars-op: .35; --ground-dim: rgba(60,20,50,.22);
    --on-sky: #ffffff; --on-sky-sh: 2px 2px 0 rgba(0,0,0,.6); --ok-text: #b6f7a4; --oops-text: #ffd6a0;
  }
  body[data-theme="night"] {
    --sky-top: #060a22; --sky-mid: #121a44; --sky-bot: #26316a;
    --sun: #e9edf6; --sun-core: #e9edf6; --sun-halo: rgba(220,230,255,.16); --sun-glow: rgba(170,190,255,.28);
    --cloud: #3a4470; --cloud-op: .55; --stars-op: 1; --ground-dim: rgba(5,10,35,.55);
    --on-sky: #ffffff; --on-sky-sh: 2px 2px 0 #000; --ok-text: #8ef07a; --oops-text: #ffb47a;
  }
  @media (orientation: landscape) and (min-width: 820px) {
    body { --gb: 28px; --nb: 22px; --fb: 13px; }
  }

  #world { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .w-sun {
    position: absolute; top: 8%; right: 11%; width: 76px; height: 76px; background: var(--sun);
    box-shadow: 0 0 0 10px var(--sun-halo), 0 0 90px 34px var(--sun-glow);
  }
  .w-sun::after { content: ""; position: absolute; inset: 18px; background: var(--sun-core); }
  /* the setting sun sits low on the right, half behind the far hills */
  body[data-theme="dusk"] .w-sun { top: auto; right: 5%; bottom: calc(3 * var(--gb) + var(--nb) + 40px); width: 128px; height: 128px; }
  body[data-theme="dusk"] .w-sun::after { inset: 30px; }
  body[data-theme="night"] .w-sun { width: 64px; height: 64px; }
  body[data-theme="night"] .w-sun::after {        /* the moon's craters */
    inset: auto; left: 12px; top: 14px; width: 12px; height: 12px; background: #c6cee0;
    box-shadow: 26px 18px 0 0 #c6cee0, 8px 34px 0 -2px #c6cee0;
  }
  .w-stars { position: absolute; top: 0; left: 0; width: 3px; height: 3px; opacity: var(--stars-op); animation: twinkle 3.2s steps(2) infinite; }
  .w-stars.s2 { width: 2px; height: 2px; animation-delay: -1.6s; }
  @keyframes twinkle { 50% { opacity: calc(var(--stars-op) * .35); } }

  .cloud {
    position: absolute; top: 7%; width: 120px; height: 32px; background: var(--cloud); opacity: var(--cloud-op);
    box-shadow: 24px -16px 0 0 var(--cloud), 56px -12px 0 0 var(--cloud), 80px 4px 0 0 var(--cloud);
    animation: drift 70s linear infinite;
  }
  .cloud.c2 { top: 17%; animation-duration: 95s; animation-delay: -40s; transform: scale(.7); }
  .cloud.c3 { top: 12%; animation-duration: 120s; animation-delay: -85s; transform: scale(1.2); }
  @keyframes drift { from { left: -180px; } to { left: 110%; } }

  .w-hills { position: absolute; left: 0; right: 0; background-repeat: repeat-x; background-position: left bottom; }
  .w-hills.far  { bottom: calc(3 * var(--gb) + var(--nb)); }
  .w-hills.near { bottom: calc(3 * var(--gb) - 2px); }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: calc(3 * var(--gb));
    background-repeat: repeat-x; background-position: left top;
    background-size: calc(16 * var(--gb)) calc(3 * var(--gb));
  }
  .ground::after, .w-hills::after { content: ""; position: absolute; inset: 0; background: var(--ground-dim); }
  @media (prefers-reduced-motion: reduce) {
    .cloud { animation: none; left: 8%; } .cloud.c2 { left: 62%; } .cloud.c3 { left: 34%; }
    .w-stars { animation: none; }
  }

  /* text that sits straight on the sky must survive every mood */
  .due, .day-row .lbl, #doneMsg, #kDone, #mDone { color: var(--on-sky); text-shadow: var(--on-sky-sh); }
  .verdict { text-shadow: var(--on-sky-sh); }
  .verdict.ok { color: var(--ok-text); }
  .verdict.oops { color: var(--oops-text); }
  .home-center { padding-bottom: calc(3 * var(--gb)); }

  /* --- the purse, as a block-game inventory panel --- */
  .purse {
    background: #c6c6c6; border: 3px solid #1b1b1b; color: #3f3f3f;
    box-shadow: inset 3px 3px 0 #ffffff, inset -3px -3px 0 #555555, 0 6px 0 rgba(0,0,0,.35);
    padding: 10px 14px 14px; width: min(100%, 400px); box-sizing: border-box;
  }
  .inv-title { font-family: var(--font-pixel); font-size: 15px; margin: 0; text-align: left; }
  .inv-total { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 12px; }
  .inv-total .num { font-family: "Press Start 2P", var(--font-pixel); font-size: clamp(24px, 3.4vw, 34px); line-height: 1; text-shadow: 3px 3px 0 #ffffff; }
  .inv-total .unit { font-family: var(--font-pixel); font-size: 18px; }
  .hotbar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .hslot {
    position: relative; aspect-ratio: 1; background: #8b8b8b;
    box-shadow: inset 3px 3px 0 #373737, inset -3px -3px 0 #ffffff;
    display: flex; align-items: center; justify-content: center;
  }
  .hslot .yen { width: 62%; height: 62%; font-size: 10px; }
  .hslot .yen.y50::after, .hslot .yen.y5::after { width: 5px; height: 5px; top: 2px; right: 2px; }
  .hslot .cnt {
    position: absolute; right: 3px; bottom: 2px; font-family: "Press Start 2P", monospace; font-size: 11px;
    color: #ffffff; text-shadow: 2px 2px 0 #3f3f3f; line-height: 1;
  }
  .purse .purse-note { color: #3f3f3f; font-family: var(--font-pixel); }

  /* --- menu buttons, cut from stone --- */
  .pick {
    appearance: none; cursor: pointer; text-align: left; width: 100%; box-sizing: border-box;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px 10px 10px; min-height: 84px;
    background-color: #7c7c7c; background-image: var(--stone-tex, none); background-size: 48px 48px;
    border: 3px solid #141414;
    box-shadow: inset 3px 3px 0 rgba(255,255,255,.45), inset -3px -4px 0 rgba(0,0,0,.45), 0 5px 0 rgba(0,0,0,.4);
    color: #ffffff; font-family: var(--font-pixel);
    transition: transform .05s ease;
  }
  .pick:active {
    transform: translateY(3px); filter: brightness(.92);
    box-shadow: inset 3px 3px 0 rgba(0,0,0,.45), inset -3px -3px 0 rgba(255,255,255,.3), 0 2px 0 rgba(0,0,0,.4);
  }
  .pick .ico {
    flex: none; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
    background: #2f2f2f; box-shadow: inset 3px 3px 0 #161616, inset -3px -3px 0 #5b5b5b; font-size: 30px; line-height: 1;
  }
  .pick .ico svg { width: 46px; height: 46px; display: block; }
  .pick .ico .glyph { font-family: var(--font-pixel); font-size: 34px; color: #ffffff; text-shadow: 3px 3px 0 #111111; }
  .pick .ttl { display: block; font-weight: 400; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.15; text-shadow: 3px 3px 0 #262626; }
  .pick .sub { display: block; font-size: 14px; color: #ececec; text-shadow: 2px 2px 0 #262626; margin-top: 5px; }

  /* --- the sky switch, top right of the start screen --- */
  .pick-top { display: flex; justify-content: flex-end; }
  .skybtn {
    appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px 6px 6px; min-height: 52px;
    background-color: #7c7c7c; background-image: var(--stone-tex, none); background-size: 48px 48px;
    border: 3px solid #141414; color: #ffffff; font-family: var(--font-pixel); font-size: 18px;
    box-shadow: inset 3px 3px 0 rgba(255,255,255,.45), inset -3px -4px 0 rgba(0,0,0,.45), 0 4px 0 rgba(0,0,0,.4);
    text-shadow: 2px 2px 0 #262626;
  }
  .skybtn:active { transform: translateY(3px); filter: brightness(.92); }
  .skyico { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    background: #2f2f2f; box-shadow: inset 2px 2px 0 #161616, inset -2px -2px 0 #5b5b5b; }
  .skyico svg { width: 32px; height: 32px; display: block; }

  /* --- the start screen: two columns when the iPad lies on its side --- */
  .pick-wrap { margin-block: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 6px 0 calc(3 * var(--gb) + 8px); }
  .pick-grid { display: grid; grid-template-columns: 1fr; gap: 16px; width: min(100%, 460px); justify-items: center; }
  .pick-grid .pick-list, .pick-grid .purse { width: 100%; }
  @media (orientation: landscape) and (min-width: 820px) {
    body[data-screen="pick"] #app { max-width: 1000px; }
    .pick-grid { grid-template-columns: 340px 460px; gap: 28px; width: auto; align-items: center; }
    #mList { display: grid; grid-template-columns: 1fr 1fr; width: min(100%, 780px); }
  }
  /* an iPad on its side is short: tighten the stacks so スタート never slips under the ground */
  @media (orientation: landscape) and (max-height: 860px) {
    .home-center { gap: 12px; padding-block: 2px calc(3 * var(--gb)); }
    #khome .wall { width: min(100%, 440px); padding: 6px; gap: 3px; }
    #khome .big-word { font-size: clamp(26px, 5vh, 40px) !important; }
  }
  /* --- カードめいじん --- */
  #cmDone { color: var(--on-sky); text-shadow: var(--on-sky-sh); font-size: 16px; font-weight: 800; margin: 0; }
  .cm-list { display: grid; grid-template-columns: 1fr; gap: 12px; width: min(100%, 460px); }
  .cm-list .pick { min-height: 70px; padding: 8px 12px 8px 8px; position: relative; }
  .cm-list .pick .ico { width: 50px; height: 50px; }
  .cm-list .pick .glyph { font-size: 28px; }
  .cm-list .pick .ttl { font-size: clamp(19px, 2.3vw, 24px); }
  .cm-list .pick.glow { border-color: var(--gold); animation: glow 1.4s ease-in-out infinite;
    box-shadow: inset 3px 3px 0 rgba(255,255,255,.45), inset -3px -4px 0 rgba(0,0,0,.45), 0 5px 0 rgba(0,0,0,.4), 0 0 0 3px var(--gold); }
  @keyframes glow { 50% { box-shadow: inset 3px 3px 0 rgba(255,255,255,.45), inset -3px -4px 0 rgba(0,0,0,.45), 0 5px 0 rgba(0,0,0,.4), 0 0 0 3px var(--gold), 0 0 22px 6px rgba(255,222,90,.8); } }
  @media (prefers-reduced-motion: reduce) { .cm-list .pick.glow { animation: none; } }
  .pick .tag { display: inline-block; margin-top: 4px; background: var(--gold); color: #3d2a00; text-shadow: none; font-size: 13px; padding: 1px 8px; border: 2px solid #141414; }
  .rings { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 6px; }
  .ring { display: inline-block; width: 13px; height: 13px; border: 3px solid var(--gold); border-radius: 50%; box-shadow: 1px 1px 0 #262626; }
  .rings.big { gap: 8px; margin: 0; } .rings.big .ring { width: 30px; height: 30px; border-width: 6px; }
  .rx { font-family: var(--font-en); font-weight: 700; margin-left: 2px; }
  @media (min-width: 600px) { .cm-list { grid-template-columns: 1fr 1fr; width: min(100%, 700px); } }
  @media (orientation: landscape) and (min-width: 820px) {
    body[data-screen="cmhome"] #app { max-width: 1000px; }
    .cm-list { grid-template-columns: repeat(3, 1fr); width: min(100%, 960px); }
  }

  .cmcard { min-height: 200px; justify-content: center; transform-origin: 50% 50%; }
  .cmcard.flipping { animation: flipx .34s ease-in-out; }
  @keyframes flipx { 0% { transform: scaleX(1); } 50% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .cmcard.flipping { animation: none; } }
  .cmcard.flipped { background: #fffbe6; border-color: var(--gold-dark); box-shadow: 0 6px 0 var(--gold-dark); }
  .cmcard .kind.back { color: var(--gold-dark); }
  .cmcard ruby rt { font-size: .45em; font-weight: 800; color: var(--ink-soft); }
  .fig { width: auto; height: clamp(170px, 34vh, 260px); max-width: 100%; display: block; }
  .fig.small { height: clamp(90px, 18vh, 140px); opacity: .85; }
  .fig rect { fill: none; stroke: #2b2118; stroke-width: .06; }
  .cm-ans { font-family: var(--font-ja); font-weight: 800; font-size: clamp(40px, 9vw, 64px); line-height: 1.2; margin: 0; color: var(--ink); }
  .cm-ans small { font-size: .5em; margin-left: .1em; }
  .cm-ans.kj { font-size: clamp(56px, 13vw, 88px); }
  .cm-ans ruby rt { font-size: .32em; }
  .cm-part { margin: 0; font-weight: 800; font-size: 20px; color: var(--ink-soft); }
  .cm-part span { font-size: 40px; color: var(--ink); vertical-align: middle; margin: 0 .2em; }
  .cm-text { font-weight: 800; font-size: clamp(22px, 5vw, 32px); line-height: 1.6; margin: 0; max-width: 24em; }
  .cm-text.boxed { border: 3px solid var(--dirt-dark); padding: 8px 18px; background: #fff; }
  .cm-sent { font-weight: 800; font-size: clamp(22px, 5vw, 32px); line-height: 2; margin: 0; max-width: 22em; }
  .cm-phrase { font-weight: 800; font-size: clamp(28px, 6vw, 40px); line-height: 1.8; margin: 0; }
  .cm-mean { font-weight: 500; font-size: clamp(17px, 3.6vw, 22px); line-height: 1.8; margin: 0; max-width: 30em; text-align: left; }
  .cm-mean b { display: inline-block; background: var(--ink); color: #fff; border-radius: 999px; padding: 0 .6em; font-size: .8em; margin-right: .3em; }
  .cm-info { font-weight: 800; font-size: 18px; color: var(--ink-soft); margin: 0; }
  /* the card text is written with spaces between phrases: break only there */
  .cm-text, .cm-sent, .cm-phrase, .cm-mean { word-break: keep-all; overflow-wrap: anywhere; }
  .hbox { display: inline-flex; gap: 3px; vertical-align: middle; margin: 0 .15em; }
  .hb { display: inline-flex; align-items: center; justify-content: center; width: 1.35em; height: 1.35em;
    border: 3px solid var(--ink); background: #fff; font-weight: 800; line-height: 1; }
  .hb.open { background: #fdf3d0; }
  .hb.got { background: #dff5d6; color: var(--ok-dark); border-color: var(--ok-dark); }
  .hb.big { width: 64px; height: 64px; }
  .k-kisetsu > .hbox, .k-hito > .hbox { font-size: clamp(26px, 6vw, 38px); }
  .season { margin: 0; font-weight: 800; font-size: 18px; color: #fff; padding: 2px 14px; border: 3px solid #141414; }
  .s-はる { background: #e86a9a; } .s-なつ { background: #2f9ad6; } .s-あき { background: #d9822b; } .s-ふゆ { background: #6f7fa8; }
  .okuri { display: flex; gap: 24px; justify-content: center; }
  .otile { writing-mode: vertical-rl; font-weight: 800; font-size: clamp(48px, 11vw, 72px); line-height: 1.3;
    background: #fff; border: 3px solid var(--stone-dark); padding: 16px 10px; min-height: 3.2em; box-shadow: 0 5px 0 var(--stone-dark); }
  .otile ruby rt { font-size: .32em; }
  .otile.ok { border-color: var(--ok-dark); background: #dff5d6; box-shadow: 0 5px 0 var(--ok-dark), 0 0 0 4px var(--ok); }
  .otile.ng { opacity: .35; text-decoration: line-through; }
  .dig { --blk: 48px; display: flex; align-items: center; gap: 10px; min-height: 68px; }
  .dig .swing { width: 44px; height: 44px; transform-origin: 80% 80%; animation: swing .5s ease-in-out infinite alternate; }
  .dig .swing svg { width: 100%; height: 100%; display: block; }
  @keyframes swing { from { transform: rotate(-30deg); } to { transform: rotate(18deg); } }
  @media (prefers-reduced-motion: reduce) { .dig .swing { animation: none; } }

  let state = freshState();
  // A copy of the last known-good save, kept so that neither an update nor a

  // Keep the copy with the most coins: a save that is already damaged must not

  function writeBackup(raw, why) {
    if (!raw) return;
    const cur = readBackup();
    if (cur) {

      if (b !== null && (a === null || a < b)) return;
    }
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify({ at: todayKey(), why: why, raw: raw })); } catch (e) { /* ignore */ }
  }
  function readBackup() {

  }
  // A code the parent can copy out and paste back. localStorage is tied to one

  function exportCode() {

  }
  function importCode(code) {
    let obj = null;
    try { obj = JSON.parse(decodeURIComponent(escape(atob(String(code).replace(/\s/g, ""))))); } catch (e) { return "よみこめません"; }
    if (!obj || !obj.players || !obj.players.taiga) return "データの形が ちがいます";
    try {
      localStorage.setItem(UNDO_KEY, JSON.stringify({ at: todayKey(), why: "よみこむ まえ", raw: localStorage.getItem(STORE_KEY) }));
      localStorage.setItem(STORE_KEY, JSON.stringify(obj));

  }
  function readUndo() {

  }
  function backupOk(b) { try { const s = JSON.parse(b.raw); return !!(s && s.players); } catch (e) { return false; } }
  function backupCoins(b) {
    try { const s = JSON.parse(b.raw); return s.players[s.player || "taiga"].coins; } catch (e) { /* fall through */ }
    const m = /"coins"\s*:\s*(\d+)/.exec(b.raw || "");   // 壊れていても、数字だけは拾えることが多い
    return m ? Number(m[1]) : null;

  function load() {
    let raw = null;

    if (raw) {
      let s = null;
      try { s = JSON.parse(raw); } catch (e) { s = null; }
      if (s && s.players) {
        if (s.ver !== SAVE_VER) writeBackup(raw, "こうしんの まえ");   // 更新でこわれても戻せるように
        state = Object.assign(freshState(), s);
      } else {
        writeBackup(raw, "よみこめなかった");   // 読めない保存は、消さずに取っておく
        brokenSave = true;
      }
    }
    for (const k of Object.keys(PLAYERS)) if (!state.players[k]) state.players[k] = freshPlayer();
    if (!state.pin) state.pin = DEFAULT_PIN;
    if (!state.quest || !QUESTS.some(q => q.id === state.quest)) state.quest = QUESTS[0].id;
    if (!state.dues) state.dues = {};
    (function advanceQuest() {                        // テストが終わった かだいは自動で次へ送る
      const cur = QUESTS.find(q => q.id === state.quest);
      if (!cur) return;
      const due = (state.dues && state.dues[cur.id]) || cur.due;
      if (!due) return;
      if (keyToDate(todayKey()) <= new Date(due + "T00:00:00")) return;
      const next = QUESTS[QUESTS.indexOf(cur) + 1];
      if (next) state.quest = next.id;
    })();
    for (const k of Object.keys(PLAYERS)) if (!state.players[k].quests) state.players[k].quests = {};   // 古い保存データを拾う
    for (const k of Object.keys(PLAYERS)) if (!state.players[k].math) state.players[k].math = {};
    for (const k of Object.keys(PLAYERS)) if (!state.players[k].cm) state.players[k].cm = { date: todayKey(), played: 0, decks: {} };
    if (!state.mOn) state.mOn = {};
    if (!state.theme || !THEMES[state.theme]) state.theme = DEFAULT_THEME;
    state.ver = SAVE_VER;

  }
  let saveError = "";
  function stamp() { const d = new Date(); return d.getMonth() + 1 + "/" + d.getDate() + " " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function save() {
    state.savedAt = stamp();

    catch (e) { saveError = (e && e.name) || "エラー"; }
  }
  // Can this browser keep anything at all between launches? The parent panel
  // shows the answer, because a save that vanishes looks identical to a reset.
  function storageProbe() {
    try {
      localStorage.setItem("coin-quest-probe", "1");

  }
  function P() { return state.players[state.player]; }
  function todayKey() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function keyToDate(k) { const a = String(k).split("-").map(Number); return new Date(a[0], (a[1] || 1) - 1, a[2] || 1); }
  function daysSince(k) {

  }
  function freshToday() { return { date: todayKey(), cleared: 0, played: 0, coins: 0, kplayed: 0 }; }
  // The daily allowance is not use-it-or-lose-it: what is left over banks up
  // (to BANK_MAX) so a busy day does not cost anything.
  function rollDay() {
    const p = P();
    if (!p.today) p.today = freshToday();
    if (p.left === undefined || p.left === null) p.left = Math.max(0, DAILY_STAGES - (p.today.cleared || 0));
    if (p.today.date !== todayKey()) {
      try { writeBackup(localStorage.getItem(STORE_KEY), "きのうまで"); } catch (e) { /* ignore */ }
      p.left = Math.min(BANK_MAX, p.left + DAILY_STAGES * daysSince(p.today.date));
      p.today = freshToday();
      save();
    }
    if (p.today.kplayed === undefined) p.today.kplayed = 0;

  // ---------------------------------------------------------------
  // AUDIO (TTS + tiny sound effects)
  // ---------------------------------------------------------------
  let voice = null, actx = null;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return;
    const prefer = ["Samantha", "Ava", "Allison", "Nicky", "Google US English", "Karen", "Daniel"];
    for (const name of prefer) { const v = vs.find(v => v.name.indexOf(name) === 0 && /en/i.test(v.lang)); if (v) { voice = v; return; } }
    voice = vs.find(v => v.lang === "en-US") || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function utter(text, rate) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = rate || 0.85; u.pitch = 1.05;
    if (voice) u.voice = voice;
    return u;
  }
  function speak(text, rate) {
    if (!state.voice || !("speechSynthesis" in window)) return;
    try { speechSynthesis.cancel(); speechSynthesis.speak(utter(text, rate)); } catch (e) { /* ignore */ }
  }
  // sentence with a blank: say the first half, a little chime, then the rest
  function speakBlank(before, after) {
    if (!state.voice || !("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const u1 = utter(before.trim() || "hmm", 0.85);
      u1.onend = function () { beep(880, .12); setTimeout(function () { if (after.trim()) speechSynthesis.speak(utter(after, 0.85)); }, 260); };
      speechSynthesis.speak(u1);
    } catch (e) { /* ignore */ }
  }
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
    } catch (e) { /* ignore */ }
    if ("speechSynthesis" in window) { try { const u = utter(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ } }
  }
  function beep(freq, dur, type, vol) {
    if (!actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.setValueAtTime(vol || 0.06, t);

    } catch (e) { /* ignore */ }
  }

  function sfxOops() { beep(220, .18, "triangle", .05); }
  function sfxCoins() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18, "square", .07), i * 110)); }

  // ---------------------------------------------------------------
  // HELPERS
  // ---------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const rnd = n => Math.floor(Math.random() * n);
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  const WORD_BY_EN = {}; WORDS.forEach(w => { WORD_BY_EN[w[0]] = w; });
  function jaOf(en) { const w = WORD_BY_EN[en] || WORD_BY_EN[en.replace(/s$/, "")]; return w ? w[1] : ""; }
  function itemById(id) {
    if (id.startsWith("w:")) return { kind: "word", w: WORD_BY_EN[id.slice(2)], id };
    if (id.startsWith("s:")) return { kind: "sent", s: SENTS[+id.slice(2)], id };
    return null;
  }

  // ---------------------------------------------------------------
  // STAGE BUILDING
  // ---------------------------------------------------------------
  function ratioL3() { return Math.min(0.85, 0.25 + P().level * 0.06); }
  // 英文は単語より重い(読む量が増える)ので、上がるほど英文を増やす
  function ratioSent() { return Math.min(0.6, 0.4 + P().level * 0.02); }
  // 日本語→英語は逆向きで難しい。level 1 から少しずつ増やす
  function ratioJa2En() { return P().level >= 1 ? Math.min(0.5, 0.2 + P().level * 0.03) : 0; }
  function pickLeastSeen(pool, exclude) {
    const seen = P().seen;
    const cands = pool.filter(id => !exclude.has(id));
    if (!cands.length) return null;
    shuffle(cands);
    cands.sort((a, b) => (seen[a] || 0) - (seen[b] || 0));
    // pick randomly among the least-seen bucket for variety
    const min = seen[cands[0]] || 0;
    const bucket = cands.filter(id => (seen[id] || 0) === min);
    return bucket[rnd(bucket.length)];
  }
  function buildStage() {
    const p = P();
    const ids = [];
    const used = new Set();
    // 1) everything missed last time comes back first
    for (const id of p.retry.slice(0, STAGE_SIZE)) { if (itemById(id) && (itemById(id).w || itemById(id).s)) { ids.push(id); used.add(id); } }
    const need = STAGE_SIZE - ids.length;
    const sentTarget = Math.round(need * ratioSent());
    const wordTarget = need - sentTarget;
    const r3 = ratioL3();
    const wordPool = lvl => WORDS.filter(w => w[2] === lvl).map(w => "w:" + w[0]);
    const sentPool = lvl => SENTS.map((s, i) => s.l === lvl ? "s:" + i : null).filter(Boolean);
    for (let i = 0; i < wordTarget; i++) {
      const lvl = Math.random() < r3 ? 3 : 4;
      const id = pickLeastSeen(wordPool(lvl), used) || pickLeastSeen(wordPool(lvl === 3 ? 4 : 3), used);
      if (id) { ids.push(id); used.add(id); }
    }
    for (let i = 0; i < sentTarget; i++) {
      const lvl = Math.random() < r3 ? 3 : 4;
      const id = pickLeastSeen(sentPool(lvl), used) || pickLeastSeen(sentPool(lvl === 3 ? 4 : 3), used);
      if (id) { ids.push(id); used.add(id); }
    }
    return shuffle(ids).map(makeQuestion);
  }
  function distractorsFor(w) {
    const same = WORDS.filter(x => x[0] !== w[0] && x[3] === w[3] && x[1] !== w[1] && x[2] === w[2]);
    const any = WORDS.filter(x => x[0] !== w[0] && x[3] === w[3] && x[1] !== w[1]);
    const pool = same.length >= 3 ? same : any;
    const out = []; const usedJa = new Set([w[1]]);
    shuffle(pool.slice());
    for (const x of shuffle(pool.slice())) { if (out.length === 3) break; if (usedJa.has(x[1])) continue; usedJa.add(x[1]); out.push(x); }
    return out;
  }
  function makeQuestion(id) {
    const it = itemById(id);

      const opts = shuffle([w].concat(ds).map(x => ({ en: x[0], ja: x[1], ok: x[0] === w[0] })));
      return { id, kind: "word", mode: ja2en ? "ja2en" : "en2ja", en: w[0], ja: w[1], opts };

  // ---------------------------------------------------------------

  function show(id) { ["pick", "home", "play", "result", "khome", "kplay", "kresult", "mhome", "mplay", "mresult", "cmhome", "cmplay", "cmresult"].forEach(s => { $(s).hidden = s !== id; }); document.body.setAttribute("data-screen", id); }

  function renderYen(total) {
    const denoms = [500, 100, 50, 10, 5, 1];
    let rest = total; const parts = [];
    for (const d of denoms) { const n = Math.floor(rest / d); rest -= n * d; if (n) parts.push([d, n]); }
    if (!parts.length) return '<p class="purse-note">クリアすると コインが たまるよ</p>';
    let html = '<div class="yen-row">';
    for (const [d, n] of parts) {
      const shown = Math.min(n, 8);
      for (let i = 0; i < shown; i++) {
        const extra = (i === shown - 1 && n > shown) ? '<span class="x">×' + n + '</span>' : "";
        html += '<span class="yen y' + d + '">' + d + extra + '</span>';
      }

    return html;
  }

  function answer(q, o, btn) {

      setTimeout(() => speak(q.text.replace("___", q.answer), 0.9), 350);
    } else if (q.mode === "ja2en") {
      setTimeout(() => speak(q.en), 250);
    } else if (!o.ok) {
      setTimeout(() => speak(q.en), 350);
    }
    const after = $("after");
    const msg = o.ok ? pickOk() : "こたえは " + (q.kind === "word" && q.mode === "en2ja" ? correctJa(q) : correctEn(q));
    after.innerHTML = '<p class="verdict ' + (o.ok ? "ok" : "oops") + '">' + esc(msg) + '</p><button class="btn next" id="nextBtn">' + (qi + 1 < stage.length ? "つぎへ ▶" : "けっか ▶") + '</button>';
    $("nextBtn").onclick = next;
    // on a miss the kid has to press it, so bring it into view on short screens
    if (!o.ok) setTimeout(() => { const n = $("nextBtn"); if (n) n.scrollIntoView({ block: "end", behavior: "smooth" }); }, 60);
    const myQi = qi, myStage = stage;   // timer only advances the question it belongs to
    if (o.ok) setTimeout(() => { if (stage === myStage && qi === myQi && $("nextBtn")) next(); }, 1400);
    save();
  }
  function correctJa(q) { return q.opts.find(x => x.ok).ja; }
  function correctEn(q) { return q.opts.find(x => x.ok).en; }
  function pickOk() { const m = ["ナイス!", "やったね!", "いいね!", "そのちょうし!", "すごい!", "ばっちり!"]; return m[rnd(m.length)]; }
  function next() {
    if (!stage || qi >= stage.length) return;
    qi++;
    if (qi < stage.length) renderQuestion(); else finishStage();
  }

  // ---- result
  function finishStage() {
    const p = P();
    const nOk = results.filter(r => r.ok).length;
    const cleared = nOk >= CLEAR_LINE;
    const wrongIds = results.filter(r => !r.ok).map(r => r.id);
    p.retry = wrongIds;                             // 次のステージで必ずもう1回
    const dayDone = p.left <= 0;
    let gained = 0;
    if (cleared) {
      p.stagesCleared++;
      if (!dayDone) { gained = COINS_PER_CLEAR; p.coins += gained; p.today.coins += gained; p.today.cleared++; p.left--; }
      if (nOk >= STAGE_SIZE) p.level = Math.min(10, p.level + 2);      // 満点は2つ上げる
      else if (nOk >= 9) p.level = Math.min(10, p.level + 1);
    } else {
      p.level = Math.max(0, p.level - 1);
    }
    save();
    show("result");
    const body = $("resultBody");
    let html = "";
    if (cleared) {
      html += '<h2 class="big-word">クリア!</h2>';
      if (gained) html += '<div class="gain"><span class="coin">¥</span>+' + gained + '</div>';
      else html += '<p class="hint" style="color:#fff;font-size:16px">コインは つかいきったけど、あそんでくれて ありがとう!</p>';
      html += '<div class="wallet"><span class="coin sm">¥</span><span>' + p.coins.toLocaleString() + '</span></div>';
    } else {
      html += '<h2 class="big-word">おしい!</h2><p style="color:#fff;font-weight:800;font-size:22px;margin:0;text-shadow:2px 2px 0 var(--dirt-dark)">もういっかい やってみよう</p>';
    }
    if (wrongIds.length) {
      html += '<div class="review"><h3>つぎも でてくる ことば(タップで きける)</h3><div class="review-list" id="reviewList"></div></div>';
    }
    const dayNowDone = p.left <= 0;
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">';
    if (cleared && dayNowDone && gained) html += '<button class="btn gold" id="homeBtn">きょうは ここまで!</button>';
    else { html += '<button class="btn green" id="againBtn">' + (cleared ? "つぎの ステージ" : "もういっかい") + '</button><button class="btn ghost" id="homeBtn">おわる</button>'; }
    html += '</div>';
    body.innerHTML = html;
    if (wrongIds.length) {
      const list = $("reviewList");
      results.filter(r => !r.ok).forEach(r => {
        const q = r.q; const b = document.createElement("button"); b.className = "chip";
        const en = q.kind === "word" ? q.en : q.answer; const ja = q.kind === "word" ? q.ja : jaOf(q.answer);
        b.innerHTML = esc(en) + (ja ? '<small>' + esc(ja) + '</small>' : "");
        b.onclick = () => speak(q.kind === "sent" ? q.text.replace("___", q.answer) : en);
        list.appendChild(b);
      });
    }
    if ($("againBtn")) $("againBtn").onclick = startStage;
    $("homeBtn").onclick = renderHome;
    if (cleared) { sfxCoins(); if (gained) coinRain(); }
  }
  function coinRain() {
    const r = $("rain"); r.innerHTML = "";
    for (let i = 0; i < 26; i++) {
      const c = document.createElement("span"); c.className = "coin"; c.textContent = "¥";
      c.style.left = Math.random() * 100 + "%"; c.style.animationDelay = (Math.random() * 0.9) + "s";
      c.style.transform = "scale(" + (0.8 + Math.random() * 0.8) + ")";
      r.appendChild(c);
    }
    setTimeout(() => { r.innerHTML = ""; }, 3200);
  }

  // ---------------------------------------------------------------
  // KANJI QUEST  (a fixed set + a deadline: done only when ALL are learned)
  // ---------------------------------------------------------------
  function quest() { return QUESTS.find(q => q.id === state.quest) || QUESTS[0]; }
  function qprog() {                       // per-player, per-quest progress
    const p = P();
    if (!p.quests) p.quests = {};
    const id = quest().id;
    if (!p.quests[id]) p.quests[id] = { hits: {}, sawB: {}, paid: {}, done: false };
    if (!p.quests[id].paid) p.quests[id].paid = {};
    return p.quests[id];
  }
  function isLearned(k) { const g = qprog(); return (g.hits[k] || 0) >= MASTER_HITS && !!g.sawB[k]; }
  function learnedCount() { return quest().items.filter(it => isLearned(it[0])).length; }
  function questDue(q) { const t = q || quest(); return (state.dues && state.dues[t.id]) || t.due || ""; }
  function daysLeft() {
    const due = questDue(); if (!due) return null;
    const d = new Date(due + "T00:00:00"), now = new Date();
    const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((d - t) / 86400000);
  }

  // Memorising works by coming back on a different day, so the number of
  // coin-earning rounds per day is worked back from the days still left.
  function kRoundsNeeded() {
    const g = qprog();
    let hits = 0;
    for (const it of quest().items) {
      const k = it[0];
      hits += Math.max(0, MASTER_HITS - (g.hits[k] || 0));
      if (!g.sawB[k] && (g.hits[k] || 0) >= MASTER_HITS) hits += 1;
    }
    return Math.ceil(hits / KSTAGE_SIZE);
  }
  const KCAP_FREE = 99;                               // 実質「上限なし」
  function computeKCap() {
    const need = kRoundsNeeded();
    if (need <= 0) return KDAILY_MIN;                 // 達成後も少しは遊べる
    const dl = daysLeft();
    if (dl === null) return KDAILY_MIN;               // 日づけ未設定のうちは詰め込まない
    if (dl <= 1) return KCAP_FREE;                    // テストが今日か明日なら、ぜんぶ おぼえるまで
    const d = dl;
    return Math.min(KDAILY_MAX, Math.max(KDAILY_MIN, Math.ceil(need / d)));
  }
  // Worked out once a day and then held: if it were recomputed as he learns,
  // the allowance would shrink under him halfway through the day.
  function kDailyCap() {
    const t = P().today;
    if (t.kcap === undefined || t.kcap === null) { t.kcap = computeKCap(); save(); }
    return t.kcap;
  }
  function kLeftToday() { return Math.max(0, kDailyCap() - (P().today.kplayed || 0)); }

  function renderKHome() {
    rollDay();
    const p = P(), q = quest(), items = q.items;
    $("kWallet").textContent = p.coins.toLocaleString();
    $("kTitle").textContent = q.name;
    const dl = daysLeft(), due = $("kDue");
    if (dl === null) { due.textContent = ""; }
    else if (dl > 1) { due.textContent = "テストまで あと " + dl + " にち"; due.className = "due"; }
    else if (dl === 1) { due.textContent = "テストは あした!"; due.className = "due soon"; }
    else if (dl === 0) { due.textContent = "テストは きょう!"; due.className = "due soon"; }
    else { due.textContent = "テストは おわったよ"; due.className = "due"; }
    let w = "";
    for (const it of items) w += '<span class="wcell' + (isLearned(it[0]) ? " on" : "") + '">' + esc(it[0]) + '</span>';
    $("kWall").innerHTML = w;
    const n = learnedCount();
    $("kCount").textContent = "おぼえた " + n + " / " + items.length;
    const all = n >= items.length;
    const left = kLeftToday(), cap = kDailyCap(), free = cap >= KCAP_FREE;
    let slots = "";
    if (!all && free) slots = '<span class="lbl">ぜんぶ そろうまで やろう!</span>';
    else if (!all) { slots = '<span class="lbl">のこり</span>';
      for (let i = 0; i < cap; i++) slots += '<span class="slot' + (i < left ? " on" : "") + '"></span>'; }
    $("kDayRow").innerHTML = slots;
    $("kDone").hidden = !(all || (!free && left <= 0));
    $("kDone").textContent = all
      ? "ぜんぶ そろった! かんぺき!"
      : "きょうの コインは ここまで。あしたに なると また もらえるよ。";
    $("kStart").textContent = left <= 0 ? "コインなしで あそぶ" : (all ? "もういちど たしかめる" : "スタート");
    $("kStart").className = "btn big " + (left <= 0 ? "ghost" : all ? "gold" : "green");
    show("khome");
  }

  let kStage = null, kQi = 0, kGained = [];
  function pickKQuestion(it, kind) {
    const items = quest().items, k = it[0], yomis = it[1];
    if (kind === "A") {                                   // 漢字 -> よみ
      const ans = yomis[rnd(yomis.length)];
      const mine = new Set(yomis), opts = [{ t: ans, ok: true }];
      const pool = shuffle(items.filter(x => x[0] !== k).slice());
      for (const x of pool) {
        if (opts.length === 4) break;
        const cand = x[1][rnd(x[1].length)];
        if (mine.has(cand) || opts.some(o => o.t === cand)) continue;
        opts.push({ t: cand, ok: false });
      }
      return { kind: "A", k, ans, opts: shuffle(opts) };
    }
    // よみ -> 漢字.
    // Only this quest's own kanji may be wrong answers: their readings are known,
    // so we can guarantee the shown reading fits exactly one of the four.
    const others = items.filter(x => x[0] !== k);
    const shared = y => others.some(x => x[1].indexOf(y) >= 0);
    const unique = yomis.filter(y => !shared(y));
    const ans = unique.length ? unique[rnd(unique.length)] : yomis[rnd(yomis.length)];
    const opts = [{ t: k, ok: true }];
    const ok = x => x[1].indexOf(ans) < 0 && !opts.some(o => o.t === x[0]);   // 同じよみの字は入れない
    const look = (LOOKALIKE[k] || []);
    const near = shuffle(others.filter(x => look.indexOf(x[0]) >= 0));        // 形が似ている字を優先
    for (const x of near) { if (opts.length === 4) break; if (ok(x)) opts.push({ t: x[0], ok: false }); }
    for (const x of shuffle(others.slice())) { if (opts.length === 4) break; if (ok(x)) opts.push({ t: x[0], ok: false }); }
    return { kind: "B", k, ans, opts: shuffle(opts) };
  }
  function buildKStage() {
    const g = qprog(), items = quest().items;
    const rest = items.filter(it => !isLearned(it[0]));
    const pool = (rest.length ? rest : items).slice();
    shuffle(pool);
    pool.sort((a, b) => (g.hits[a[0]] || 0) - (g.hits[b[0]] || 0));   // 苦手な字から
    const chosen = pool.slice(0, KSTAGE_SIZE);
    while (chosen.length < KSTAGE_SIZE && items.length) chosen.push(items[rnd(items.length)]);
    return shuffle(chosen.map((it, i) => pickKQuestion(it, (i % 2 === 0 || !g.sawB[it[0]]) ? "B" : "A")));
  }
  let kPaid = false;
  function startKStage() {
    unlockAudio(); rollDay();
    kPaid = kLeftToday() > 0 && kRoundsNeeded() > 0;   // 上限をこえた回と、覚えきったあとはコインなし
    P().today.kplayed = (P().today.kplayed || 0) + 1; save();
    kStage = buildKStage(); kQi = 0; kGained = [];
    show("kplay"); renderKQuestion();
  }
  function renderKQuestion() {
    const q = kStage[kQi];
    let h = "";
    for (let i = 0; i < kStage.length; i++) h += '<span class="pblock' + (i < kQi ? " done" : i === kQi ? " now" : "") + '"></span>';
    $("kProgress").innerHTML = h;
    $("kWallet2").textContent = P().coins.toLocaleString();
    $("kAfter").innerHTML = "";
    if (q.kind === "A") {
      $("kCard").innerHTML = '<p class="kind">なんて よむ?</p><p class="kanji-big">' + esc(q.k) + '</p>';
    } else {
      $("kCard").innerHTML = '<p class="kind">どの かんじ?</p><p class="yomi-big">' + esc(q.ans) + '</p>';
    }
    const ch = $("kChoices"); ch.innerHTML = "";
    q.opts.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "choice" + (q.kind === "B" ? " kanji" : "");
      b.textContent = o.t; b.id = "kchoice" + i;
      b.onclick = () => kAnswer(q, o, b);
      ch.appendChild(b);
    });
  }
  function kAnswer(q, o, btn) {
    const buttons = Array.from($("kChoices").children);
    buttons.forEach(b => { b.disabled = true; });
    const blk = $("kProgress").children[kQi];
    if (blk) blk.className = "pblock done breaking";
    const g = qprog();
    const wasLearned = isLearned(q.k);
    if (o.ok) {
      btn.classList.add("right");
      buttons.forEach(b => { if (b !== btn) b.classList.add("dim"); });
      g.hits[q.k] = (g.hits[q.k] || 0) + 1;
      if (q.kind === "B") g.sawB[q.k] = true;
      sfxRight();
    } else {
      btn.classList.add("wrong");
      buttons.forEach(b => { if (b.textContent === (q.kind === "A" ? q.ans : q.k)) b.classList.add("right"); else if (b !== btn) b.classList.add("dim"); });
      g.hits[q.k] = Math.max(0, (g.hits[q.k] || 0) - 1);   // 減るだけ。ゼロ止まり
      const wrong = P().wrong; wrong["k:" + q.k] = (wrong["k:" + q.k] || 0) + 1;
      sfxOops();
    }
    if (!wasLearned && isLearned(q.k) && !g.paid[q.k]) { g.paid[q.k] = true; kGained.push(q.k); }
    const msg = o.ok ? pickOk() : "こたえは " + (q.kind === "A" ? q.ans : q.k);
    $("kAfter").innerHTML = '<p class="verdict ' + (o.ok ? "ok" : "oops") + '">' + esc(msg) + '</p>' +
      '<button class="btn next" id="kNextBtn">' + (kQi + 1 < kStage.length ? "つぎへ &#9654;" : "けっか &#9654;") + '</button>';
    $("kNextBtn").onclick = kNext;
    if (!o.ok) setTimeout(() => { const n = $("kNextBtn"); if (n) n.scrollIntoView({ block: "end", behavior: "smooth" }); }, 60);
    const myQi = kQi, myStage = kStage;
    if (o.ok) setTimeout(() => { if (kStage === myStage && kQi === myQi && $("kNextBtn")) kNext(); }, 1400);
    save();
  }
  function kNext() {
    if (!kStage || kQi >= kStage.length) return;
    kQi++;
    if (kQi < kStage.length) renderKQuestion(); else finishKStage();
  }
  function finishKStage() {
    const p = P(), g = qprog(), items = quest().items;
    let coins = (kPaid ? KCOINS_STAGE : 0) + kGained.length * KCOINS_LEARN;   // おぼえた分は上限に関係なく出す
    const all = learnedCount() >= items.length;
    const firstAll = all && !g.done;
    if (firstAll) { g.done = true; coins += KCOINS_ALL; }   // 達成のごほうびは上限に関係なく1回だけ出す
    p.coins += coins; save();
    show("kresult");
    let html = '<h2 class="big-word" style="font-family:var(--font-ja);font-size:clamp(34px,9vw,60px)">' +
      (firstAll ? "ぜんぶ そろった!" : kGained.length ? "ブロック ゲット!" : "おつかれさま!") + '</h2>';
    if (kGained.length) {
      html += '<div class="review"><h3>あたらしく おぼえた かんじ</h3><div class="review-list">' +
        kGained.map(k => '<span class="wcell on" style="width:52px;height:52px;font-size:30px">' + esc(k) + '</span>').join("") +
        '</div></div>';
    }
    html += coins
      ? '<div class="gain"><span class="coin">&#165;</span>+' + coins + '</div>'
      : '<p class="hint" style="color:#fff;font-size:16px">きょうの コインは ここまで。あそんでくれて ありがとう!</p>';
    html += '<div class="wallet"><span class="coin sm">&#165;</span><span>' + p.coins.toLocaleString() + '</span></div>';
    html += '<p class="hint" style="color:#fff;font-size:16px">おぼえた ' + learnedCount() + ' / ' + items.length + '</p>';
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">' +
      '<button class="btn green" id="kAgain">つづける</button>' +
      '<button class="btn ghost" id="kHomeBtn">おわる</button></div>';
    $("kResultBody").innerHTML = html;
    $("kAgain").onclick = startKStage;
    $("kHomeBtn").onclick = renderKHome;
    if (kGained.length || firstAll) { sfxCoins(); coinRain(); }
  }

  // ---- the quest picker: the only thing 泰河 sees at the top
  function renderPick() {
    rollDay();
    const p = P();
    $("splash2").textContent = SPLASHES[rnd(SPLASHES.length)];
    applyTheme(myTheme());
    renderSkyBtn();

    mRollDay();
    const q = quest(), n = learnedCount(), dl = daysLeft();

    const esub = "コインが もらえる のこり " + p.left + " かい";

        ? item("goCm", ICONS.cards, "カードめいじん", (cmDaysLeft() > 0 ? "テストまで あと " + cmDaysLeft() + " にち・" : "テストは きょう!・") + "コイン のこり " + cmLeft() + " かい")
        : item("goKa", ICONS.scroll, q.name, sub)) +
