  // ---------------------------------------------------------------
  // MATH  (speed practice: every question must come out right, and the
  //        only thing measured is how long the whole set took)
  // ---------------------------------------------------------------
  function mProg() {
    const p = P();
    if (!p.math) p.math = {};
    return p.math;
  }
  function evRec(id) {
    const m = mProg();
    if (!m[id]) m[id] = { best: null, runs: [], done: 0 };
    if (!m[id].runs) m[id].runs = [];
    return m[id];
  }
  function evOn(ev) {
    const on = (state.mOn && state.mOn[ev.id]);
    return on === undefined ? ev.on : !!on;
  }
  // The target is built from his own recent times, so a harder event gets a
  // longer target and beating it stays possible as the work gets heavier.
  function targetTime(id) {
    const r = evRec(id);
    if (r.runs.length < 2) return null;              // まだ目安が出せない
    const sorted = r.runs.slice().sort((a, b) => a - b);
    const mid = sorted[Math.floor(sorted.length / 2)];
    return Math.max(3, Math.round(mid * 0.95));      // ほんの少しだけ速く
  }
  function mRollDay() {
    const p = P();
    if (p.mLeft === undefined || p.mLeft === null) p.mLeft = M_DAILY;
    if (p.mDate !== todayKey()) {
      const gap = p.mDate ? daysSince(p.mDate) : 1;
      p.mLeft = Math.min(M_BANK_MAX, (p.mDate ? p.mLeft : 0) + M_DAILY * gap);
      p.mDate = todayKey();
      save();
    }
  }
  function fmtTime(sec) { return sec === null || sec === undefined ? "—" : sec + "びょう"; }

  function makeMQuestion(ev) {
    if (ev.dan) {
      const b = 1 + rnd(9);
      return { t: ev.dan + " × " + b, a: String(ev.dan * b) };
    }
    if (ev.id === "add21") {                          // 2桁+1桁、くり上がりあり、答えは2桁
      for (;;) {
        const a = 10 + rnd(80), b = 2 + rnd(8);
        if ((a % 10) + b >= 10 && a + b <= 99) return { t: a + " + " + b, a: String(a + b) };
      }
    }
    for (;;) {                                        // 2桁−1桁、くり下がりあり、答えは2桁
      const a = 12 + rnd(88), b = 2 + rnd(8);
      if ((a % 10) < b && a - b >= 10) return { t: a + " − " + b, a: String(a - b) };
    }
  }

  let mEv = null, mQueue = [], mTotal = 0, mTyped = "", mStart = 0, mPaid = false, mLock = false;

  function startMStage(ev) {
    unlockAudio(); mRollDay();
    mEv = ev;
    mPaid = P().mLeft > 0;      // 回数を減らすのは終わったとき。やめた回は減らさない
    mQueue = []; for (let i = 0; i < ev.n; i++) mQueue.push(makeMQuestion(ev));
    mTotal = ev.n; mTyped = ""; mLock = false;
    show("mplay");
    renderMQuestion();
    mStart = Date.now();                              // 1問目が出てから計り始める
  }
  function renderMQuestion() {
    const q = mQueue[0];
    let h = "";
    const doneCount = Math.max(0, mTotal - mQueue.length);
    for (let i = 0; i < mTotal; i++) h += '<span class="pblock' + (i < doneCount ? " done" : i === doneCount ? " now" : "") + '"></span>';
    $("mProgress").innerHTML = h;
    $("mWallet2").textContent = P().coins.toLocaleString();
    $("mCard").innerHTML = '<p class="sum">' + esc(q.t) + ' = <span class="ansbox" id="mAns">' +
      (mTyped || "&nbsp;") + '</span></p>';
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "けす", "0", ""];
    $("mPad").innerHTML = keys.map(k =>
      k === "" ? '<span></span>'
        : '<button class="key' + (k === "けす" ? " del" : "") + '" data-k="' + esc(k) + '">' + esc(k) + '</button>'
    ).join("");
    Array.from($("mPad").querySelectorAll(".key")).forEach(b => {
      b.onclick = () => mKey(b.getAttribute("data-k"));
    });
  }
  function mKey(k) {
    if (mLock) return;
    const q = mQueue[0];
    if (k === "けす") { mTyped = mTyped.slice(0, -1); $("mAns").innerHTML = mTyped || "&nbsp;"; return; }
    if (mTyped.length >= 3) return;
    mTyped += k;
    $("mAns").textContent = mTyped;
    if (mTyped.length < q.a.length) return;           // まだ桁が足りない
    mLock = true;
    const box = $("mAns");
    if (mTyped === q.a) {
      box.className = "ansbox ok"; sfxRight();
      const blk = $("mProgress").children[Math.max(0, mTotal - mQueue.length)];
      if (blk) blk.className = "pblock done breaking";
      mQueue.shift();
      setTimeout(() => { mTyped = ""; mLock = false; if (mQueue.length) renderMQuestion(); else finishMStage(); }, 260);
    } else {
      box.className = "ansbox ng"; sfxOops();
      mQueue.push(mQueue.shift());                    // まちがえた問題は うしろに回る
      // ブロックは増やさない。苦戦するほどゴールが遠のくと、途中でやめてしまう
      setTimeout(() => { mTyped = ""; mLock = false; renderMQuestion(); }, 700);
    }
  }
  function quitMStage() {
    if (mEv && mQueue.length) {                       // 1問も残さず終えた回は「やめた」ではない
      const r = evRec(mEv.id);
      r.quit = (r.quit || 0) + 1;
      r.quitAt = mTotal - mQueue.length;              // 何問めでやめたか
      save();
    }
    mEv = null; mQueue = [];
    renderMHome();
  }
  function finishMStage() {
    const p = P(), r = evRec(mEv.id);
    const sec = Math.max(1, Math.round((Date.now() - mStart) / 1000));
    const target = targetTime(mEv.id);
    const prevBest = r.best;
    const beatTarget = target !== null && sec <= target;
    const newBest = prevBest === null || sec < prevBest;
    if (newBest) r.best = sec;
    r.runs.push(sec); if (r.runs.length > M_KEEP_RUNS) r.runs.shift();
    r.done++;
    let coins = 0;
    if (mPaid) {
      coins = MCOINS_DONE + (beatTarget ? MCOINS_FAST : 0) + (newBest && prevBest !== null ? MCOINS_BEST : 0);
      p.coins += coins;
      p.mLeft = Math.max(0, p.mLeft - 1);
    }
    save();
    show("mresult");
    let html = '<h2 class="big-word" style="font-family:var(--font-ja);font-size:clamp(30px,8vw,52px)">ぜんぶ せいかい!</h2>';
    html += '<p class="bigtime">' + sec + 'びょう</p>';
    if (prevBest === null) html += '<p class="hint" style="color:#fff;font-size:18px">はじめての きろく!</p>';
    else if (newBest) html += '<p class="hint" style="color:#fff;font-size:18px">きろく こうしん! まえは ' + prevBest + 'びょう</p>';
    else html += '<p class="hint" style="color:#fff;font-size:16px">さいこう きろく ' + prevBest + 'びょう</p>';
    if (coins) html += '<div class="gain"><span class="coin">&#165;</span>+' + coins + '</div>';
    else html += '<p class="hint" style="color:#fff;font-size:16px">きょうの コインは ここまで。あそんでくれて ありがとう!</p>';
    html += '<div class="wallet"><span class="coin sm">&#165;</span><span>' + p.coins.toLocaleString() + '</span></div>';
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">' +
      '<button class="btn green" id="mAgain">もういちど</button>' +
      '<button class="btn ghost" id="mHomeBtn">ほかの しゅもく</button></div>';
    $("mResultBody").innerHTML = html;
    $("mAgain").onclick = () => startMStage(mEv);
    $("mHomeBtn").onclick = renderMHome;
    if (coins) { sfxCoins(); if (newBest) coinRain(); }
  }

  function renderMHome() {
    rollDay(); mRollDay();
    const p = P();
    $("mWallet").textContent = p.coins.toLocaleString();
    let slots = '<span class="lbl">のこり</span>';
    for (let i = 0; i < Math.min(p.mLeft, M_BANK_MAX); i++) slots += '<span class="slot on"></span>';
    if (p.mLeft <= 0) slots += '<span class="slot"></span>';
    $("mDayRow").innerHTML = slots;
    $("mDone").hidden = p.mLeft > 0;
    $("mDone").textContent = "きょうの コインは つかいきった! でも まだ あそべるよ。";
    const evs = M_EVENTS.filter(evOn);
    $("mList").innerHTML = evs.map(ev => {
      const r = evRec(ev.id);
      const best = r.best === null ? "きろく なし" : "さいこう " + r.best + "びょう";
      const g = ev.dan ? "×" : ev.id === "add21" ? "+" : "−";
      return '<button class="pick" data-ev="' + ev.id + '"><span class="ico"><b class="glyph">' + g + '</b></span><span>' +
        '<span class="ttl">' + esc(ev.name) + '</span>' +
        '<span class="sub">' + esc(ev.sub) + ' ・ <span class="ev-time">' + esc(best) + '</span></span></span></button>';
    }).join("");
    Array.from($("mList").querySelectorAll(".pick")).forEach(b => {
      b.onclick = () => { const ev = M_EVENTS.find(e => e.id === b.getAttribute("data-ev")); if (ev) startMStage(ev); };
    });
    show("mhome");
  }

  // ---------------------------------------------------------------
  // カードめいじん (flip cards: think, flip, see the answer. Nothing is
  // marked right or wrong; the only record is how often each card was
  // turned over and which ones he said he does not know yet)
  // ---------------------------------------------------------------
  function cmDue() { return (state.dues && state.dues["card-meijin"]) || CM_DUE; }
  function cmDaysLeft() {
    const d = new Date(cmDue() + "T00:00:00"), now = new Date();
    return Math.round((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  }
  // テストびまでは「かんじ」の入口が カードめいじんに なる。すぎたら自動で かんじに もどる
  function cmActive() { return state.cmMode !== "off" && cmDaysLeft() >= 0; }
  function cmProg() {
    const p = P();
    if (!p.cm) p.cm = { date: todayKey(), played: 0, decks: {} };
    if (!p.cm.decks) p.cm.decks = {};
    if (p.cm.date !== todayKey()) { p.cm.date = todayKey(); p.cm.played = 0; }
    return p.cm;
  }
  function cmRec(deck) {
    const c = cmProg();
    if (!c.decks[deck.id]) c.decks[deck.id] = { n: {}, mada: {} };
    return c.decks[deck.id];
  }
  function cmLeft() { return Math.max(0, CM_DAILY - (cmProg().played || 0)); }
  function cmFlips(deck, card) { return cmRec(deck).n[card.id] || 0; }
  // one ring = every card in the pile turned over once more
  function cmRings(deck) { return deck.cards.reduce((m, c) => Math.min(m, cmFlips(deck, c)), Infinity); }
  function cmTotal(deck) { return deck.cards.reduce((s, c) => s + cmFlips(deck, c), 0); }
  // the pile he has turned least lights up, so all of them get their turn
  function cmHot() {
    let best = null, bs = null;
    for (const d of CM_DECKS) {
      const s = [cmRings(d), cmTotal(d) / d.cards.length];
      if (!best || s[0] < bs[0] || (s[0] === bs[0] && s[1] < bs[1] - 1e-9)) { best = d; bs = s; }
    }
    return best;
  }

  // 《》 = ふりがな
  function rb(s) { return esc(s).replace(/([一-鿿々]+)《([^》]+)》/g, "<ruby>$1<rt>$2</rt></ruby>"); }
  function plain(s) { return String(s).replace(/《[^》]*》/g, "").replace(/[{}]/g, ""); }
  // the boxes printed on the card: letters he is given, and empty ones to fill in his head
  function boxes(h, fill) {
    return '<span class="hbox">' + Array.from(h).map((ch, i) =>
      '<span class="hb' + (ch === "_" ? (fill ? " got" : " open") : "") + '">' +
      (ch === "_" ? (fill ? esc(Array.from(fill)[i] || "") : "") : esc(ch)) + '</span>').join("") + '</span>';
  }
  function withBoxes(s, fill) {                     // "父《ちち》からの {ことづ_}を…"
    return s.split(/(\{[^}]*\})/).map(part => {
      const m = /^\{([^}]*)\}$/.exec(part);
      return m ? boxes(m[1], fill) : rb(part);
    }).join("");
  }
  function figSVG(c, small) {
    let pts = [], body = "";
    if (c.g) {
      c.g.forEach((row, y) => Array.from(row).forEach((ch, x) => {
        if (ch !== "X") return;
        body += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
        pts.push([x, y], [x + 1, y + 1]);
      }));
    } else {
      c.L.forEach(s => { body += '<line x1="' + s[0] + '" y1="' + s[1] + '" x2="' + s[2] + '" y2="' + s[3] + '"/>'; pts.push([s[0], s[1]], [s[2], s[3]]); });
    }
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0;
    const pad = Math.max(w, h) * 0.06, sw = Math.max(w, h) * 0.022;
    return '<svg class="fig' + (small ? " small" : "") + '" viewBox="' + (x0 - pad) + " " + (y0 - pad) + " " + (w + pad * 2) + " " + (h + pad * 2) +
      '" style="aspect-ratio:' + ((w + pad * 2) / (h + pad * 2)).toFixed(3) + '"><g fill="none" stroke="#2b2118" stroke-width="' + sw.toFixed(3) +
      '" stroke-linejoin="round" stroke-linecap="round">' + body + '</g></svg>';
  }
  const CM_ASK = {
    fig: c => c.t === "sq" ? "正方形《せいほうけい》は いくつ？" : "三角形《さんかくけい》は いくつ？",
    okuri: () => "ただしい おくりがなは どっち？",
    bushu: () => "ぶしゅの なまえは？",
    juku: () => "かんじ 2もじの ことばに すると？",
    kanyo: () => "□に はいる ことばは？",
    kisetsu: () => "なんの ことば？",
    kotoba: () => "□に はいる ことばは？",
    hito: () => "だれの ことかな？"
  };
  function cmFront(deck, c) {
    switch (deck.k) {
      case "fig": return figSVG(c);
      case "okuri": return '<div class="okuri">' + c.pair.map(s => '<span class="otile">' + rb(s) + '</span>').join("") + '</div>';
      case "bushu": return '<p class="kanji-big">' + esc(c.q) + '</p>';
      case "juku": return '<p class="cm-text boxed">' + rb(c.m) + '</p><span class="hbox">' + '<span class="hb open big"></span><span class="hb open big"></span></span>';
      case "kanyo": return '<p class="cm-phrase">' + withBoxes(c.p) + '</p><p class="cm-mean"><b>いみ</b> ' + rb(c.m) + '</p>';
      case "kisetsu": return '<p class="season s-' + esc(c.s) + '">' + esc(c.s) + '</p>' + boxes(c.h) + '<p class="cm-mean">' + rb(c.m) + '</p>';
      case "kotoba": return '<p class="cm-sent">' + withBoxes(c.s) + '</p>';
      case "hito": return boxes(c.h) + '<p class="cm-mean">' + rb(c.d) + '</p>';
    }
    return "";
  }
  function cmBack(deck, c) {
    switch (deck.k) {
      case "fig": return '<p class="cm-ans">' + c.a + '<small>こ</small></p>' + figSVG(c, true);
      case "okuri": return '<div class="okuri">' + c.pair.map(s => '<span class="otile' + (s === c.c ? " ok" : " ng") + '">' + rb(s) + '</span>').join("") + '</div>';
      case "bushu": return '<p class="cm-ans">' + esc(c.a) + '</p>' + (c.p ? '<p class="cm-part"><span>' + esc(c.q) + '</span> の ぶしゅ <span>' + esc(c.p) + '</span></p>' : '<p class="cm-part"><span>' + esc(c.q) + '</span> は この <ruby>字<rt>じ</rt></ruby> ぜんぶが ぶしゅ</p>');
      case "juku": return '<p class="cm-ans kj"><ruby>' + esc(c.a) + '<rt>' + esc(c.r) + '</rt></ruby></p><p class="cm-text">' + rb(c.m) + '</p>';
      case "kanyo": return '<p class="cm-ans">' + rb(c.a) + '</p><p class="cm-phrase">' + rb(c.f) + '</p><p class="cm-mean"><b>いみ</b> ' + rb(c.m) + '</p>';
      case "kisetsu": return '<p class="season s-' + esc(c.s) + '">' + esc(c.s) + '</p><p class="cm-ans">' + esc(c.a) + '</p><p class="cm-mean">' + rb(c.m) + '</p>';
      case "kotoba": {
        const m = /\{([^}]*)\}/.exec(c.s);
        return '<p class="cm-ans">' + esc(c.a) + '</p><p class="cm-sent">' + withBoxes(c.s, m ? c.a : "") + '</p><p class="cm-mean"><b>いみ</b> ' + rb(c.m) + '</p>';
      }
      case "hito": return '<p class="cm-ans">' + esc(c.a) + '</p><p class="cm-info">' + rb(c.i) + '</p><p class="cm-mean">' + rb(c.d) + '</p>';
    }
    return "";
  }
  // Long enough to have read the card, so tapping straight through does not pay.
  // No numbers are shown while he waits: a pickaxe digs instead.
  function cmWait(deck, c) {
    if (deck.k === "fig") return 3000;
    const txt = plain([c.m, c.s, c.d, c.p, c.h, c.q].filter(Boolean).join(""));
    return Math.min(6000, Math.max(2000, 1500 + txt.length * 45));
  }

  let cmDeck = null, cmCards = [], cmI = 0, cmPaid = false, cmTok = 0, cmRing0 = 0, cmHotId = "";
  function cmBuild(deck) {
    const r = cmRec(deck);
    const pool = shuffle(deck.cards.slice());
    // まだ の カードが先、あとは めくった回数が少ない じゅん
    pool.sort((a, b) => ((r.mada[a.id] ? 0 : 1) - (r.mada[b.id] ? 0 : 1)) || (cmFlips(deck, a) - cmFlips(deck, b)));
    return pool.slice(0, CM_ROUND).map(c => deck.k === "okuri" ? Object.assign({}, c, { pair: shuffle([c.c, c.w]) }) : c);
  }
  function startCm(deck) {
    unlockAudio();
    cmDeck = deck; cmHotId = cmHot().id;
    cmPaid = cmLeft() > 0;            // 回数を へらすのは さいごまで めくったとき
    cmRing0 = cmRings(deck);
    cmCards = cmBuild(deck); cmI = 0;
    show("cmplay"); renderCmCard();
  }
  function renderCmCard() {
    const c = cmCards[cmI], tok = ++cmTok;
    let h = "";
    for (let i = 0; i < cmCards.length; i++) h += '<span class="pblock' + (i < cmI ? " done" : i === cmI ? " now" : "") + '"></span>';
    $("cmProgress").innerHTML = h;
    $("cmWallet2").textContent = P().coins.toLocaleString();
    const card = $("cmCard");
    card.className = "card cmcard k-" + cmDeck.k;
    card.innerHTML = '<p class="kind">' + rb(CM_ASK[cmDeck.k](c)) + '</p>' + cmFront(cmDeck, c);
    $("cmCtl").innerHTML = '<div class="dig" aria-label="まってね"><span class="swing">' + ICONS.pick + '</span><span class="pblock now"></span></div>';
    setTimeout(() => {
      if (tok !== cmTok) return;
      $("cmCtl").innerHTML = '<button class="btn next" id="cmFlip">めくる</button>';
      $("cmFlip").onclick = cmFlip;
    }, cmWait(cmDeck, c));
  }
  function cmFlip() {
    const c = cmCards[cmI], tok = cmTok, r = cmRec(cmDeck);
    r.n[c.id] = (r.n[c.id] || 0) + 1; save();
    $("cmCtl").innerHTML = "";
    const card = $("cmCard");
    card.classList.add("flipping");
    beep(520, .06, "square", .04);
    setTimeout(() => {
      if (tok !== cmTok) return;
      card.innerHTML = '<p class="kind back">こたえ</p>' + cmBack(cmDeck, c);
      card.classList.add("flipped");
    }, 170);
    setTimeout(() => {
      if (tok !== cmTok) return;
      card.classList.remove("flipping");
      const blk = $("cmProgress").children[cmI];
      if (blk) blk.className = "pblock done breaking";
      $("cmCtl").innerHTML = '<button class="btn next" id="cmOk">わかった</button>' +
        '<button class="btn ghost mada" id="cmMada">まだ</button>';
      $("cmOk").onclick = () => cmMark(false);
      $("cmMada").onclick = () => cmMark(true);
    }, 360);
  }
  // 「まだ」は つぎから 多めに出すための しるし。コインにも きろくにも ひびかない
  function cmMark(mada) {
    const c = cmCards[cmI], r = cmRec(cmDeck);
    if (mada) r.mada[c.id] = 1; else delete r.mada[c.id];
    save();
    cmI++;
    if (cmI < cmCards.length) renderCmCard(); else finishCm();
  }
  function finishCm() {
    cmTok++;
    const p = P(), cm = cmProg(), deck = cmDeck;
    const rings = cmRings(deck), gotRing = rings > cmRing0;
    let coins = 0;
    if (cmPaid) {
      coins = CMCOINS_ROUND + (gotRing ? CMCOINS_RING : 0) + (deck.id === cmHotId ? CMCOINS_PICK : 0);
      p.coins += coins;
      cm.played = (cm.played || 0) + 1;
    }
    save();
    show("cmresult");
    let html = '<h2 class="big-word" style="font-family:var(--font-ja);font-size:clamp(30px,8vw,52px)">' +
      (gotRing ? "リング ゲット!" : "めくった!") + '</h2>';
    if (gotRing) html += '<p class="rings big">' + cmRingIcons(rings) + '</p>' +
      '<p class="hint" style="color:#fff;font-size:18px;text-shadow:2px 2px 0 #000">「' + esc(deck.name) + '」を ぜんぶ ' + rings + 'しゅう めくった!</p>';
    if (coins) html += '<div class="gain"><span class="coin">&#165;</span>+' + coins + '</div>' +
      (cmPaid && deck.id === cmHotId ? '<p class="hint" style="color:#fff;font-size:15px;text-shadow:2px 2px 0 #000">おすすめの カードで +' + CMCOINS_PICK + '</p>' : '');
    else html += '<p class="hint" style="color:#fff;font-size:16px">きょうの コインは ここまで。めくってくれて ありがとう!</p>';
    html += '<div class="wallet"><span class="coin sm">&#165;</span><span>' + p.coins.toLocaleString() + '</span></div>';
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">' +
      '<button class="btn green" id="cmAgain">つづける</button>' +
      '<button class="btn ghost" id="cmHomeBtn">ほかの カード</button></div>';
    $("cmResultBody").innerHTML = html;
    $("cmAgain").onclick = () => startCm(deck);
    $("cmHomeBtn").onclick = renderCmHome;
    if (coins) { sfxCoins(); if (gotRing) coinRain(); }
  }
  function cmRingIcons(n) {
    if (!n || !isFinite(n)) return "";
    return n <= 5 ? Array(n + 1).join('<span class="ring"></span>') : '<span class="ring"></span><span class="rx">×' + n + '</span>';
  }
  function renderCmHome() {
    rollDay(); cmTok++;
    const p = P(), left = cmLeft(), hot = cmHot(), dl = cmDaysLeft();
    $("cmWallet").textContent = p.coins.toLocaleString();
    const due = $("cmDueLine");
    if (dl > 1) { due.textContent = "テストまで あと " + dl + " にち"; due.className = "due"; }
    else if (dl === 1) { due.textContent = "テストは あした!"; due.className = "due soon"; }
    else if (dl === 0) { due.textContent = "テストは きょう!"; due.className = "due soon"; }
    else { due.textContent = ""; }
    let slots = '<span class="lbl">のこり</span>';
    for (let i = 0; i < CM_DAILY; i++) slots += '<span class="slot' + (i < left ? " on" : "") + '"></span>';
    $("cmDayRow").innerHTML = slots;
    $("cmDone").hidden = left > 0;
    $("cmDone").textContent = "きょうの コインは ここまで。でも まだ めくれるよ。";
    $("cmList").innerHTML = CM_DECKS.map(d => {
      const rings = cmRings(d), glow = d === hot;
      return '<button class="pick' + (glow ? " glow" : "") + '" data-deck="' + d.id + '"><span class="ico"><b class="glyph">' + esc(d.glyph) + '</b></span><span>' +
        '<span class="ttl">' + esc(d.name) + '</span>' +
        '<span class="sub">' + d.cards.length + 'まい' + (rings ? ' <span class="rings">' + cmRingIcons(rings) + '</span>' : '') + '</span>' +
        (glow ? '<span class="tag">おすすめ +' + CMCOINS_PICK + '</span>' : '') + '</span></button>';
    }).join("");
    Array.from($("cmList").querySelectorAll(".pick")).forEach(b => {
      b.onclick = () => { const d = CM_DECKS.find(x => x.id === b.getAttribute("data-deck")); if (d) startCm(d); };
    });
    show("cmhome");
  }

  // ---------------------------------------------------------------
  // WORLD: blocky scenery drawn as pixel art at start-up. All of it is
  // original artwork in a block-game idiom; nothing is copied from a game.
  // ---------------------------------------------------------------

  function seeded(seed) {                            // the same world every time the app opens
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pixURL(w, h, rects) {
    let s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" shape-rendering="crispEdges">';
    for (const r of rects) s += '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" fill="' + r[4] + '"/>';
    return 'url("data:image/svg+xml,' + encodeURIComponent(s + '</svg>') + '")';
  }
  function specks(rects, R, x0, y0, w, h, n, colors) {
    for (let i = 0; i < n; i++) {
      rects.push([x0 + Math.floor(R() * w), y0 + Math.floor(R() * h), 1, 1, colors[Math.floor(R() * colors.length)]]);
    }
  }

  // three layers of 8x8 blocks: grass on top, dirt, then stone with ore in it
  const ORE_AT = { 2: ["#f6c343", "#b77a0c"], 6: ["#61e4dc", "#239a93"], 10: ["#e23b3b", "#861212"], 13: ["#3a3a3a", "#141414"] };
  function groundTile() {
    const R = seeded(11), r = [], W = 16;
    for (let b = 0; b < W; b++) {
      const x = b * 8;
      r.push([x, 0, 8, 8, "#86572a"]);
      specks(r, R, x, 3, 8, 5, 9, ["#744a22", "#9a6834", "#6a421d"]);
      r.push([x, 0, 8, 2, "#63b83d"]);
      for (let i = 0; i < 8; i++) if (R() < 0.6) r.push([x + i, 2, 1, R() < 0.3 ? 2 : 1, "#55a534"]);
      specks(r, R, x, 0, 8, 2, 4, ["#79cf53", "#4f9e30"]);
      r.push([x, 8, 8, 8, "#7f5227"]);
      specks(r, R, x, 8, 8, 8, 12, ["#6d4520", "#946233", "#5f3b1a"]);
      r.push([x, 16, 8, 8, "#8a8a8a"]);
      specks(r, R, x, 16, 8, 8, 14, ["#777777", "#9e9e9e", "#6c6c6c", "#a8a8a8"]);
      const ore = ORE_AT[b];
      if (ore) for (const [ox, oy] of [[1, 1], [4, 2], [2, 5], [5, 5]]) {
        r.push([x + ox, 16 + oy, 2, 2, ore[1]]);
        r.push([x + ox, 16 + oy, 1, 1, ore[0]]);
      }
      r.push([x + 7, 0, 1, 24, "rgba(0,0,0,.12)"]);          // faint seams between blocks
      r.push([x, 15, 8, 1, "rgba(0,0,0,.12)"]);
    }
    return pixURL(W * 8, 24, r);
  }

  // stepped hills; the height walk is closed so the tile repeats without a seam
  function hillTile(t, cols, seed, lo, hi, far) {
    const R = seeded(seed), u = 4, room = far ? 0 : 6, rows = hi + room, H = rows * u, r = [];
    const hs = []; let h = lo + Math.floor(R() * (hi - lo + 1));
    for (let c = 0; c < cols; c++) { if (R() < 0.45) h += R() < 0.5 ? -1 : 1; h = Math.max(lo, Math.min(hi, h)); hs.push(h); }
    for (let c = cols - 1; c >= 0; c--) {
      const next = c === cols - 1 ? hs[0] : hs[c + 1];
      if (hs[c] > next + 1) hs[c] = next + 1;
      if (hs[c] < next - 1) hs[c] = next - 1;
    }
    for (let c = 0; c < cols; c++) {
      const top = H - hs[c] * u;
      r.push([c * u, top, u, H - top, far ? t.far : t.near]);
      r.push([c * u, top, u, 1, far ? t.farTop : t.nearTop]);
    }
    if (!far) for (const c of [4, 15, 25]) {               // a few trees standing on the hills
      const top = H - hs[c] * u;
      r.push([c * u, top - 3 * u, u, 3 * u, t.trunk]);
      r.push([(c - 1) * u, top - 5 * u, 3 * u, 2 * u, t.leaf]);
      r.push([c * u, top - 6 * u, u, u, t.leaf]);
      r.push([(c - 1) * u, top - 3 * u - 1, 3 * u, 1, t.leafDk]);
      r.push([(c - 1) * u + 1, top - 5 * u + 1, 1, 1, t.leafDk]);
    }
    return { url: pixURL(cols * u, H, r), cols: cols, rows: rows };
  }

  function stoneTex() {
    const R = seeded(5), r = [[0, 0, 16, 16, "#7c7c7c"]];
    specks(r, R, 0, 0, 16, 16, 40, ["#6e6e6e", "#8b8b8b", "#727272", "#939393"]);
    return pixURL(16, 16, r);
  }

  function starField(n, seed) {
    const R = seeded(seed), out = [];
    for (let i = 0; i < n; i++) {
      out.push((R() * 100).toFixed(1) + "vw " + (R() * 55).toFixed(1) + "vh 0 0 rgba(255,255,255," + (0.5 + R() * 0.5).toFixed(2) + ")");
    }
    return out.join(",");
  }

    $("voiceTest").onclick = () => { unlockAudio(); speak("Let's build a house with wood."); };
    const coinAmt = id => { const v = parseInt(($(id).value || "").replace(/[^0-9]/g, ""), 10); return isFinite(v) && v > 0 ? Math.min(v, 9999) : 0; };
    const coinDone = msg => { $("coinMsg").textContent = msg; $("panelCoins").textContent = P().coins; save(); renderPick(); };
    $("giveCoins").onclick = () => {
      const n = coinAmt("coinPlus");
      if (!n) { $("coinMsg").textContent = "1いじょうの すうじを いれてください"; return; }
      P().coins += n;
      coinDone("+" + n + " わたしました。いま " + P().coins + " コイン");
    };
    $("spendCoins").onclick = () => {
      const n = coinAmt("coinMinus"), p2 = P();
      if (!n) { $("coinMsg").textContent = "1いじょうの すうじを いれてください"; return; }
      if (p2.coins <= 0) { $("coinMsg").textContent = "コインが ありません"; return; }
      const used = Math.min(n, p2.coins);   // never goes below zero
      p2.coins -= used;
      coinDone((used < n ? "コインが たりないので " : "") + "−" + used + " つかいました。のこり " + p2.coins + " コイン");
    };
    $("resetBtn").onclick = () => { if (confirm(PLAYERS[state.player] + " のデータを全部消します。よろしいですか?")) { state.players[state.player] = freshPlayer(); save(); closeParent(); renderPick(); } };
    $("pinSave").onclick = () => { const v = $("pinNew").value.trim(); if (/^\d{4,6}$/.test(v)) { state.pin = v; save(); alert("あんしょうばんごうを " + v + " にしました"); } else alert("4〜6けたの すうじで"); };
    if ($("restoreBtn")) $("restoreBtn").onclick = () => {
      const b = readBackup(); if (!b) return;
      const c = backupCoins(b);
      if (!confirm("いまのデータを " + b.at + " の控え(コイン " + (c === null ? "?" : c) + ")に もどします。よろしいですか?")) return;
      try {
        localStorage.setItem(UNDO_KEY, JSON.stringify({ at: todayKey(), why: "もどす まえ", raw: localStorage.getItem(STORE_KEY) }));
        localStorage.setItem(STORE_KEY, b.raw);
      } catch (e) { alert("もどせませんでした"); return; }
      location.reload();
    };
    if ($("restoreCoins")) $("restoreCoins").onclick = () => {
      const b = readBackup(); if (!b) return;
      const c = backupCoins(b); if (c === null) return;
      if (!confirm("コインを " + c + " に もどします。よろしいですか?")) return;
      P().coins = c; save(); closeParent(); renderPick();
    };
    if ($("undoBtn")) $("undoBtn").onclick = () => {
      const u = readUndo(); if (!u || !u.raw) return;
      if (!confirm("もどす まえの データに 戻します。よろしいですか?")) return;
      try { localStorage.setItem(STORE_KEY, u.raw); localStorage.removeItem(UNDO_KEY); } catch (e) { return; }
      location.reload();
    };
    Array.from(document.querySelectorAll(".mchk")).forEach(c => {
      c.onchange = () => { state.mOn[c.getAttribute("data-ev")] = c.checked; save(); };
    });
    $("expBtn").onclick = () => {
      const c = exportCode();
      $("codeBox").value = c;
      $("codeMsg").textContent = c ? "このコードを メモに はりつけて とっておいてください(" + c.length + "文字)" : "かきだせませんでした";
      $("codeBox").focus(); $("codeBox").select();
    };
    $("copyBtn").onclick = async () => {
      const c = $("codeBox").value.trim() || exportCode();
      $("codeBox").value = c; $("codeBox").select();
      try { await navigator.clipboard.writeText(c); $("codeMsg").textContent = "コピーしました"; }
      catch (e) { $("codeMsg").textContent = "コピーできないので、えらんで ⌘C / 長おし→コピー してください"; }
    };
    $("impBtn").onclick = () => {
      const c = $("codeBox").value.trim();
      if (!c) { $("codeMsg").textContent = "コードを はりつけてください"; return; }
      if (!confirm("いまのデータを、はりつけた コードで 上書きします。よろしいですか?")) return;
      const err = importCode(c);
      if (err) { $("codeMsg").textContent = err; return; }
      location.reload();
    };
    $("closePanel").onclick = closeParent;
    div.addEventListener("click", e => { if (e.target === div) closeParent(); });
  }
  function closeParent() { const d = $("panel"); if (d) d.remove(); }

  // ---------------------------------------------------------------
  // BOOT
  // ---------------------------------------------------------------
  function init() {
    load();
    $("startBtn").onclick = startStage;
    $("quitBtn").onclick = () => { try { speechSynthesis.cancel(); } catch (e) {} renderHome(); };
    $("eBack").onclick = renderPick;
    $("kStart").onclick = startKStage;
    $("kBack").onclick = renderPick;
    $("kQuit").onclick = () => { try { speechSynthesis.cancel(); } catch (e) {} renderKHome(); };
    $("mBack").onclick = renderPick;
    $("mQuit").onclick = quitMStage;
    $("cmBack").onclick = renderPick;
    $("cmQuit").onclick = () => { cmTok++; renderCmHome(); };
    bindLongPress($("purse"), 2000, askPin);
    bindLongPress($("purse2"), 2000, askPin);
    document.addEventListener("touchstart", function once() { unlockAudio(); document.removeEventListener("touchstart", once); }, { passive: true });
    buildWorld(); applyTheme(myTheme());
    $("skyBtn").onclick = nextSky;
    renderPick();
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(init); else init();
})();
</script>
